    el.tabHistory.setAttribute("tabindex", isToday ? "-1" : "0");
    if(!isToday) renderHistory();
  }

  function handleTabKeydown(e){
    var targetTab = null;
    if(e.key === "ArrowRight" || e.key === "ArrowDown"){
      targetTab = e.currentTarget === el.tabToday ? el.tabHistory : el.tabToday;
    } else if(e.key === "ArrowLeft" || e.key === "ArrowUp"){
      targetTab = e.currentTarget === el.tabToday ? el.tabHistory : el.tabToday;
    } else if(e.key === "Home"){
      targetTab = el.tabToday;
    } else if(e.key === "End"){
      targetTab = el.tabHistory;
    }
    if(!targetTab) return;
    e.preventDefault();
    targetTab.focus();
    showTab(targetTab === el.tabToday ? "today" : "history");
  }

  el.tabToday.addEventListener("click", function(){ showTab("today"); });
  el.tabHistory.addEventListener("click", function(){ showTab("history"); });
  el.tabToday.addEventListener("keydown", handleTabKeydown);
  el.tabHistory.addEventListener("keydown", handleTabKeydown);

  // ---------- toast ----------
  var toastTimer = null;
  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.classList.remove("show"); }, 2400);
  }

  // ---------- render: today / draft ----------
  function renderDraft(){
    el.locationInput.value = draft.location || "";

    el.itemsList.innerHTML = "";
    if(draft.items.length === 0){
      el.emptyNote.style.display = "block";
    } else {
      el.emptyNote.style.display = "none";
      draft.items.forEach(function(item){
        var li = document.createElement("li");
        li.className = "item-row" + (item.id === editingId ? " editing" : "");
        li.innerHTML =
          '<div class="item-main">' +
            '<div class="item-name"></div>' +
            '<div class="item-meta mono"></div>' +
          '</div>' +
          '<div class="item-right">' +
            '<span class="item-subtotal mono"></span>' +
            '<button class="item-edit" aria-label="Edit item" type="button">&#9998;</button>' +
            '<button class="item-del" aria-label="Delete item" type="button">&times;</button>' +
          '</div>';
        li.querySelector(".item-name").textContent = item.name;
        li.querySelector(".item-meta").textContent = "x" + item.qty + "  ·  " + money(item.price) + "/ea";
        li.querySelector(".item-subtotal").textContent = money(subtotal(item));
        li.querySelector(".item-edit").addEventListener("click", function(){ enterEdit(item); });
        li.querySelector(".item-del").addEventListener("click", function(){ removeItem(item.id); });
        el.itemsList.appendChild(li);
      });
    }

    var t = total(draft.items);
    el.runningTotalAmount.textContent = money(t);
    el.totalAmount.textContent = money(t);

    var hasItems = draft.items.length > 0;
    el.saveBtn.disabled = !hasItems;
    el.saveHint.textContent = hasItems
      ? draft.items.length + " item(s) · Ready to save"
      : "Add at least 1 item before saving";
  }

  var locationDebounceTimer = null;
  var locationSnapshot = null;

  function cancelLocationSave(){
    if(locationDebounceTimer){
      clearTimeout(locationDebounceTimer);
      locationDebounceTimer = null;
    }
    locationSnapshot = null;
  }

  function persistDraft(previousDraft){
    cancelLocationSave();
    if(saveDraft(draft)) return true;
    if(previousDraft) draft = previousDraft;
    renderDraft();
    return false;
  }

  el.locationInput.addEventListener("input", function(){
    var val = el.locationInput.value;
    if(val.length > 100){
      val = val.slice(0, 100);
      el.locationInput.value = val;
    }
    if(!locationDebounceTimer) locationSnapshot = cloneDraft(draft);
    draft.location = val;
    clearTimeout(locationDebounceTimer);
    locationDebounceTimer = setTimeout(function(){
      locationDebounceTimer = null;
      if(!saveDraft(draft)){
        if(locationSnapshot) draft = locationSnapshot;
        el.locationInput.value = draft.location || "";
        renderDraft();
        showToast("Location change was not saved");
      }
      locationSnapshot = null;
    }, 250);
  });

  // The debounce above is lost if the PWA is backgrounded or closed inside the
  // 250 ms window, which is exactly when a shopper types the store name and
  // leaves. Flush synchronously on the reliable unload signals (iOS ignores
  // beforeunload) and on blur. Silent: the page may be going away.
  function flushLocationSave(){
    if(!locationDebounceTimer) return;
    clearTimeout(locationDebounceTimer);
    locationDebounceTimer = null;
    var snapshot = locationSnapshot;
    locationSnapshot = null;
    if(!saveDraft(draft, true)){
      if(snapshot) draft = snapshot;
      el.locationInput.value = draft.location || "";
    }
  }

  window.addEventListener("pagehide", flushLocationSave);
  el.locationInput.addEventListener("blur", flushLocationSave);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) flushLocationSave();
  });

  // ---------- add / edit / remove items ----------
  function clearForm(){
    el.itemName.value = "";
    el.itemPrice.value = "";
    el.itemQty.value = "1";
    clearFieldError(el.itemName);
    clearFieldError(el.itemPrice);
    clearFieldError(el.itemQty);
    closeSuggestions();
  }

  function enterEdit(item){
    editingId = item.id;
    el.itemName.value = item.name;
    el.itemPrice.value = item.price;
    el.itemQty.value = item.qty;
    el.editBannerText.textContent = "Editing: " + item.name;
    el.editBanner.hidden = false;
    el.addBtn.textContent = "Save Changes";
    el.addBtn.classList.add("editing");
    renderDraft();
    el.itemName.focus();
  }

  function exitEdit(){
    editingId = null;
    el.editBanner.hidden = true;
    el.editBannerText.textContent = "";
    el.addBtn.textContent = "+ Add Item";
    el.addBtn.classList.remove("editing");
    clearForm();
  }

  el.cancelEditBtn.addEventListener("click", function(){
    exitEdit();
    renderDraft();
  });

  // ---------- undo popup (single slot: last destructive action wins) ----------
  var undoTimer = null;
  var pendingUndo = null;

  function hideUndoPopup(){
    clearTimeout(undoTimer);
    undoTimer = null;
    pendingUndo = null;
    if(el.undoPopup){
      el.undoPopup.classList.remove("show");
      el.undoPopup.hidden = true;
    }
  }

  function showUndoPopup(message, action){
    pendingUndo = action;
    el.undoPopupText.textContent = message;
    el.undoPopup.hidden = false;
    void el.undoPopup.offsetWidth;
    el.undoPopup.classList.add("show");

    clearTimeout(undoTimer);
    undoTimer = setTimeout(function(){
      hideUndoPopup();
    }, 5000);
  }

  function undoEdit(snapshot){
    var previousDraft = cloneDraft(draft);
    var found = false;
    for(var i=0; i<draft.items.length; i++){
      if(draft.items[i].id === snapshot.id){
        draft.items[i].name = snapshot.name;
        draft.items[i].price = snapshot.price;
        draft.items[i].qty = snapshot.qty;
        found = true;
        break;
      }
    }
    if(!found){
      draft.items.push({
        id: snapshot.id,
        name: snapshot.name,
        price: snapshot.price,
        qty: snapshot.qty
      });
    }
    if(!persistDraft(previousDraft)){
      showToast("Undo was not saved. Your previous list was restored.");
      return;
    }
    hideUndoPopup();
    renderDraft();
    showToast("Reverted changes to " + snapshot.name);
  }

  function undoItemDelete(action){
    var existing = false;
    for(var i=0; i<draft.items.length; i++){
      if(draft.items[i].id === action.item.id){ existing = true; break; }
    }
    if(existing){
      hideUndoPopup();
      return;
    }
    var previousDraft = cloneDraft(draft);
    var insertAt = action.index;
    if(typeof insertAt !== "number" || insertAt < 0 || insertAt > draft.items.length){
      insertAt = draft.items.length;
    }
    draft.items.splice(insertAt, 0, {
      id: action.item.id,
      name: action.item.name,
      price: action.item.price,
      qty: action.item.qty
    });
    if(!persistDraft(previousDraft)){
      showToast("Undo was not saved. Your previous list was restored.");
      return;
    }
    hideUndoPopup();
    renderDraft();
    showToast("Restored " + action.item.name);
  }

  function undoHistoryDelete(action){
    for(var i=0; i<sessions.length; i++){
      if(sessions[i].id === action.session.id){
        hideUndoPopup();
        showToast("That trip is already in History");
        return;
      }
    }
    var nextSessions = cloneSessions(sessions);
    var insertAt = action.index;
    if(typeof insertAt !== "number" || insertAt < 0 || insertAt > nextSessions.length){
      insertAt = nextSessions.length;
    }
    nextSessions.splice(insertAt, 0, cloneSessions([action.session])[0]);
    if(!saveSessions(nextSessions)){
      showToast("Undo was not saved because the change could not be saved");
      return;
    }
    commitSessions(nextSessions);
    hideUndoPopup();
    if(!el.viewHistory.hidden) renderHistory();
    showToast("Trip restored to History");
  }

  el.undoBtn.addEventListener("click", function(){
    if(!pendingUndo) return;
    var action = pendingUndo;
    if(action.type === "edit") undoEdit(action.snapshot);
    else if(action.type === "item-delete") undoItemDelete(action);
    else if(action.type === "history-delete") undoHistoryDelete(action);
  });

  // ---------- clear today & form ----------
  function clearAllToday(){
    var hasItems = draft.items.length > 0;
    var hasFields = el.itemName.value.trim() !== "" || el.itemPrice.value.trim() !== "" || (draft.location && draft.location.trim() !== "");
    if(!hasItems && !hasFields) return;
    if(hasItems && !confirm("Clear all items and form fields?")) return;

    var candidate = { location:"", items:[] };
    cancelLocationSave();
    if(!saveDraft(candidate)){
      renderDraft();
      showToast("Today's list was not cleared because it could not be saved");
      return;
    }
    hideUndoPopup();
    exitEdit();
    draft = candidate;
    renderDraft();
    showToast("Cleared Today's list and form");
  }
  el.clearBtn.addEventListener("click", clearAllToday);

  function clearFieldError(input){
    input.removeAttribute("aria-invalid");
    input.removeAttribute("aria-describedby");
  }
  function markFieldError(input){
    input.setAttribute("aria-invalid", "true");
    input.setAttribute("aria-describedby", "toast");
  }

  function addItem(){
    var name = el.itemName.value.trim().slice(0, 150);
    var price = parseStrictNumber(el.itemPrice.value);
    var qty = parseStrictNumber(el.itemQty.value);

    clearFieldError(el.itemName);
    clearFieldError(el.itemPrice);
    clearFieldError(el.itemQty);

    if(!name){ markFieldError(el.itemName); el.itemName.focus(); return; }
    if(!isFinite(price) || price < 0 || price > 10000000){
      showToast("Please enter a valid price (0 - 10,000,000)");
      markFieldError(el.itemPrice);
      el.itemPrice.focus();
      return;
    }
    if(!isFinite(qty) || qty < 1 || Math.floor(qty) !== qty){
      showToast("Please enter a whole quantity of 1 or more");
      markFieldError(el.itemQty);
      el.itemQty.focus();
      return;
    }

    price = roundMoney(price);
    if(!isFinite(price)){
      showToast("The price is outside the supported numeric range");
      markFieldError(el.itemPrice);
      el.itemPrice.focus();
      return;
    }

    var candidate = cloneDraft(draft);
    var previousItem = null;
    var wasEditing = Boolean(editingId);
    if(wasEditing){
      var idx = -1;
      for(var i=0; i<candidate.items.length; i++){
        if(candidate.items[i].id === editingId){ idx = i; break; }
      }
      if(idx !== -1){
        previousItem = {
          id:candidate.items[idx].id,
          name:candidate.items[idx].name,
          price:candidate.items[idx].price,
          qty:candidate.items[idx].qty
        };
        candidate.items[idx].name = name;
        candidate.items[idx].price = price;
        candidate.items[idx].qty = qty;
      } else {
        candidate.items.push({ id:uniqueItemId(candidate.items), name:name, price:price, qty:qty });
      }
    } else {
      candidate.items.push({ id:uniqueItemId(candidate.items), name:name, price:price, qty:qty });
    }

    if(!isFinite(total(candidate.items))){
      showToast("This quantity would make the total exceed the supported numeric range");
      markFieldError(el.itemQty);
      el.itemQty.focus();
      return;
    }

    cancelLocationSave();
    if(!saveDraft(candidate)) return;
    draft = candidate;
    if(wasEditing){
      exitEdit();
    } else {
      clearForm();
      el.itemName.focus();
    }
    if(previousItem) showUndoPopup("Edited: " + name, { type:"edit", snapshot:previousItem });
    renderDraft();
  }
  el.addBtn.addEventListener("click", addItem);

  function removeItem(id){
    var candidate = cloneDraft(draft);
    var removedItem = null;
    var removedIndex = -1;
    for(var i=0; i<candidate.items.length; i++){
      if(candidate.items[i].id === id){
        removedItem = candidate.items[i];
        removedIndex = i;
        break;
      }
    }
    if(!removedItem) return;
    candidate.items.splice(removedIndex, 1);

    cancelLocationSave();
    if(!saveDraft(candidate)){
      showToast("Item was not deleted because the change could not be saved");
      return;
    }
    draft = candidate;
    if(id === editingId) exitEdit();
    renderDraft();
    showUndoPopup("Deleted: " + removedItem.name, {
      type:"item-delete",
      item:{
        id:removedItem.id,
        name:removedItem.name,
        price:removedItem.price,
        qty:removedItem.qty
      },
      index:removedIndex
    });
  }

  // ---------- autocomplete (memoized & keyboard accessible) ----------
  var activeSuggIndex = -1;
  var currentSuggestions = [];

  function knownItems(){
    if(cachedKnownItems) return cachedKnownItems;
    var map = Object.create(null);
    var all = [];
    sessions.forEach(function(s){
      if(Array.isArray(s.items)){
        s.items.forEach(function(i){ all.push({ item:i, when:s.date }); });
      }
    });
    all.sort(function(a,b){
      var timeA = new Date(a.when).getTime() || 0;
      var timeB = new Date(b.when).getTime() || 0;
      return timeB - timeA;
    });
    all.forEach(function(rec){
      var key = rec.item.name.trim().toLowerCase();
      if(!map[key]) map[key] = rec.item;
    });
    cachedKnownItems = Object.keys(map).map(function(k){ return map[k]; });
    return cachedKnownItems;
  }

  function closeSuggestions(){
    el.suggestions.hidden = true;
    el.suggestions.innerHTML = "";
    el.itemName.setAttribute("aria-expanded", "false");
    el.itemName.removeAttribute("aria-activedescendant");
    activeSuggIndex = -1;
    currentSuggestions = [];
  }

  function updateSuggestionSelection(){
    var buttons = el.suggestions.querySelectorAll("button");
    for(var i=0; i<buttons.length; i++){
      if(i === activeSuggIndex){
        buttons[i].classList.add("active");
        buttons[i].setAttribute("aria-selected", "true");
        el.itemName.setAttribute("aria-activedescendant", buttons[i].id);
        if(typeof buttons[i].scrollIntoView === "function"){
          buttons[i].scrollIntoView({ block:"nearest" });
        }
      } else {
        buttons[i].classList.remove("active");
        buttons[i].setAttribute("aria-selected", "false");
      }
    }
    if(activeSuggIndex < 0){
      el.itemName.removeAttribute("aria-activedescendant");
    }
  }

  function selectSuggestion(item){
    el.itemName.value = item.name;
    el.itemPrice.value = item.price;
    closeSuggestions();
    el.itemPrice.focus();
    try{ el.itemPrice.select(); }catch(err){}
  }

  el.itemName.addEventListener("input", function(){
    var q = el.itemName.value.trim().toLowerCase();
    if(!q){ closeSuggestions(); return; }
    var matches = knownItems().filter(function(i){
      return i.name.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 5);

    if(matches.length === 0){ closeSuggestions(); return; }

    currentSuggestions = matches;
    activeSuggIndex = -1;
    el.suggestions.innerHTML = "";
    matches.forEach(function(m, idx){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("role", "option");
      btn.setAttribute("aria-selected", "false");
      btn.id = "sugg-option-" + idx;
      btn.innerHTML = '<span></span><span class="sugg-price mono"></span>';
      btn.querySelector("span").textContent = m.name;
      btn.querySelector(".sugg-price").textContent = money(m.price);
      btn.addEventListener("pointerdown", function(e){
        e.preventDefault();
        selectSuggestion(m);
      });
      btn.addEventListener("click", function(){ selectSuggestion(m); });
      el.suggestions.appendChild(btn);
    });
    el.suggestions.hidden = false;
    el.itemName.setAttribute("aria-expanded", "true");
  });

  el.itemName.addEventListener("keydown", function(e){
    if(!el.suggestions.hidden && currentSuggestions.length > 0){
      if(e.key === "ArrowDown"){
        e.preventDefault();
        activeSuggIndex = (activeSuggIndex + 1) % currentSuggestions.length;
        updateSuggestionSelection();
        return;
      }
      if(e.key === "ArrowUp"){
        e.preventDefault();
        if(activeSuggIndex <= 0){
          activeSuggIndex = currentSuggestions.length - 1;
        } else {
          activeSuggIndex--;
        }
        updateSuggestionSelection();
        return;
      }
      if(e.key === "Enter" && activeSuggIndex >= 0 && activeSuggIndex < currentSuggestions.length){
        e.preventDefault();
        selectSuggestion(currentSuggestions[activeSuggIndex]);
        return;
      }
      if(e.key === "Escape"){
        e.preventDefault();
        closeSuggestions();
        return;
      }
    }
    if(e.key === "Enter"){
      e.preventDefault();
      addItem();
    }
  });

  [el.itemPrice, el.itemQty].forEach(function(input){
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); addItem(); }
    });
  });

  document.getElementById("nameFieldWrap").addEventListener("focusout", function(e){
    if(!document.getElementById("nameFieldWrap").contains(e.relatedTarget)){
      closeSuggestions();
    }
  });

  document.addEventListener("click", function(e){
    if(!document.getElementById("nameFieldWrap").contains(e.target)) closeSuggestions();
  });

  // ---------- save trip ----------
  function findPendingSavedSession(currentDraft){
    if(!currentDraft.pendingSavedSessionId) return null;
    var pending = null;
    for(var i=0; i<sessions.length; i++){
      if(sessions[i].id === currentDraft.pendingSavedSessionId){
        pending = sessions[i];
        break;
      }
    }
    if(!pending || pending.items.length !== currentDraft.items.length) return null;
    var draftLocation = (currentDraft.location || "").trim() || "Unspecified Location";
    if(pending.location !== draftLocation) return null;
    for(var j=0; j<pending.items.length; j++){
      var savedItem = pending.items[j];
      var draftItem = currentDraft.items[j];
      if(savedItem.id !== draftItem.id || savedItem.name !== draftItem.name ||
         savedItem.price !== draftItem.price || savedItem.qty !== draftItem.qty) return null;
    }
    return pending;
  }

  el.saveBtn.addEventListener("click", function(){
    if(draft.items.length === 0) return;
    var previousDraft = cloneDraft(draft);
    var existingSavedSession = findPendingSavedSession(draft);
    if(existingSavedSession){
      var clearedDraft = { location:"", items:[] };
      cancelLocationSave();
      if(!saveDraft(clearedDraft)){
        renderDraft();
        showToast("Trip is already saved to History, but Today's draft could not be cleared.");
        return;
      }
      hideUndoPopup();
      exitEdit();
      draft = clearedDraft;
      renderDraft();
      showToast("Already saved to History · Today's draft cleared");
      return;
    }

    var currentDraft = cloneDraft(draft);
    currentDraft.pendingSavedSessionId = null;
    currentDraft.location = (el.locationInput.value || "").slice(0, 100);
    var session = {
      id:uniqueSessionId(sessions),
      date:new Date().toISOString(),
      location:currentDraft.location.trim() || "Unspecified Location",
      items:cloneDraft(currentDraft).items,
      total:total(currentDraft.items)
    };
    if(!isFinite(session.total)){
      showToast("This trip total exceeds the supported numeric range");
      return;
    }

    // Persist the pending session ID with the draft before writing History.
    // This makes the two-key save recoverable without creating duplicate trips.
    currentDraft.pendingSavedSessionId = session.id;
    cancelLocationSave();
    if(!saveDraft(currentDraft)){
      draft = previousDraft;
      renderDraft();
      showToast("Trip was not saved because today's draft could not be protected");
      return;
    }
    draft = currentDraft;

    var nextSessions = cloneSessions(sessions);
    nextSessions.unshift(session);
    // A future-dated imported trip can outrank a trip saved today, so the save
    // path must re-apply the same ordering the load/import paths use.
    sortSessionsByDate(nextSessions);
    if(!saveSessions(nextSessions)){
      renderDraft();
      showToast("Trip was not saved. Today's list remains unchanged.");
      return;
    }
    commitSessions(nextSessions);

    var emptyDraft = { location:"", items:[] };
    if(!saveDraft(emptyDraft)){
      draft = currentDraft;
      renderDraft();
      showToast("Trip saved to History, but Today's draft could not be cleared. Press Save again to clear it safely.");
      return;
    }

    hideUndoPopup();
    exitEdit();
    draft = emptyDraft;
    renderDraft();
    showToast("Saved · " + session.items.length + " item(s) · " + money(session.total));
  });

  // ---------- history ----------
  // A full re-render used to reset every accordion and drop keyboard focus.
  // openHistoryId preserves the open panel by session id; deletes remove a
  // single node and move focus instead of rebuilding the whole subtree.
  var openHistoryId = null;

  function setOpenHistoryPanel(detail, toggle, sessionId){
    detail.hidden = false;
    toggle.setAttribute("aria-expanded", "true");
    openHistoryId = sessionId;
  }

  function renderHistory(){
    el.historyList.innerHTML = "";
    if(sessions.length === 0){
      openHistoryId = null;
      el.historyEmpty.hidden = false;
      return;
    }
    el.historyEmpty.hidden = true;

    sessions.forEach(function(s, historyIndex){
      var wrap = document.createElement("div");
      wrap.className = "stub-wrap";
      wrap.setAttribute("data-session-id", s.id);

      wrap.innerHTML =
        '<div class="stub-tear"></div>' +
        '<div class="stub">' +
          '<button class="stub-top" id="history-toggle-' + historyIndex + '" type="button" aria-expanded="false" aria-controls="history-detail-' + historyIndex + '">' +
            '<span class="stub-summary-left">' +
              '<span class="stub-loc"></span>' +
              '<span class="stub-date"></span>' +
            '</span>' +
            '<span class="stub-summary-right">' +
              '<span class="stub-total"></span>' +
              '<span class="stub-count"></span>' +
            '</span>' +
          '</button>' +
          '<div class="stub-detail" id="history-detail-' + historyIndex + '" role="region" aria-labelledby="history-toggle-' + historyIndex + '" hidden>' +
            '<hr class="divider" />' +
            '<ul class="items"></ul>' +
            '<div class="stub-actions">' +
              '<button type="button" class="edit-btn">Load to Today</button>' +
              '<button type="button" class="danger del-btn">Delete</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      wrap.querySelector(".stub-loc").textContent = s.location;
      wrap.querySelector(".stub-date").textContent = formatDateTimeSafe(s.date);
      wrap.querySelector(".stub-total").textContent = money(s.total);
      wrap.querySelector(".stub-count").textContent = (Array.isArray(s.items) ? s.items.length : 0) + " item(s)";

      var itemsUl = wrap.querySelector(".items");
      if(Array.isArray(s.items)){
        s.items.forEach(function(i){
          var li = document.createElement("li");
          li.className = "item-row";
          li.innerHTML =
            '<div class="item-main">' +
              '<div class="item-name"></div>' +
              '<div class="item-meta mono"></div>' +
            '</div>' +
            '<div class="item-right"><span class="item-subtotal mono"></span></div>';
          li.querySelector(".item-name").textContent = i.name;
          li.querySelector(".item-meta").textContent = "x" + i.qty + "  ·  " + money(i.price) + "/ea";
          li.querySelector(".item-subtotal").textContent = money(subtotal(i));
          itemsUl.appendChild(li);
        });
      }

      var detail = wrap.querySelector(".stub-detail");
      var toggle = wrap.querySelector(".stub-top");
      toggle.addEventListener("click", function(){
        var willOpen = detail.hidden;
        var allDetails = document.querySelectorAll(".stub-detail");
        var allToggles = document.querySelectorAll(".stub-top");
        for(var dIdx=0; dIdx<allDetails.length; dIdx++){
          allDetails[dIdx].hidden = true;
        }
        for(var tIdx=0; tIdx<allToggles.length; tIdx++){
          allToggles[tIdx].setAttribute("aria-expanded", "false");
        }
        if(willOpen){
          setOpenHistoryPanel(detail, toggle, s.id);
        } else {
          detail.hidden = true;
          toggle.setAttribute("aria-expanded", "false");
          if(openHistoryId === s.id) openHistoryId = null;
        }
      });

      if(openHistoryId === s.id){
        setOpenHistoryPanel(detail, toggle, s.id);
      }

      wrap.querySelector(".edit-btn").addEventListener("click", function(){
        if(draft.items.length > 0 || draft.location){
          if(!confirm("Current items in the 'Today' tab will be replaced with this list. Continue?")) return;
        }
        var restoredItems = [];
        for(var restoredIndex=0; restoredIndex<s.items.length; restoredIndex++){
          var sourceItem = s.items[restoredIndex];
          restoredItems.push({
            id:uniqueItemId(restoredItems),
            name:sourceItem.name,
            price:sourceItem.price,
            qty:sourceItem.qty
          });
        }
        var candidate = {
          location:s.location,
          items:restoredItems
        };
        cancelLocationSave();
        if(!saveDraft(candidate)){
          showToast("The trip was not loaded because today's draft could not be saved");
          return;
        }
        hideUndoPopup();
        exitEdit();
        draft = candidate;
        renderDraft();
        showTab("today");
        showToast("Loaded trip into Today tab");
      });

      wrap.querySelector(".del-btn").addEventListener("click", function(){
        if(!confirm("Delete this entire trip?")) return;
        var removedIndex = -1;
        for(var sIdx=0; sIdx<sessions.length; sIdx++){
          if(sessions[sIdx].id === s.id){ removedIndex = sIdx; break; }
        }
        if(removedIndex === -1) return;

        var removedSession = cloneSessions([sessions[removedIndex]])[0];
        var nextSessions = cloneSessions(sessions);
        nextSessions.splice(removedIndex, 1);
        if(!saveSessions(nextSessions)){
          showToast("Trip was not deleted because the change could not be saved");
          return;
        }
        commitSessions(nextSessions);

        if(openHistoryId === s.id) openHistoryId = null;
        if(wrap.parentNode) wrap.parentNode.removeChild(wrap);
        if(sessions.length === 0) el.historyEmpty.hidden = false;

        var remainingToggles = el.historyList.querySelectorAll(".stub-top");
        if(remainingToggles.length > 0){
          var focusIndex = removedIndex >= remainingToggles.length ? remainingToggles.length - 1 : removedIndex;
          remainingToggles[focusIndex].focus();
        } else {
          el.tabHistory.focus();
        }

        showUndoPopup("Deleted trip: " + removedSession.location, {
          type:"history-delete",
          session:removedSession,
          index:removedIndex
        });
      });

      el.historyList.appendChild(wrap);
    });
  }

  // ---------- cross-tab sync ----------
  function reloadThemeFromStorage(){
    var remoteTheme = "default";
    try{ remoteTheme = localStorage.getItem(THEME_KEY) || "default"; }catch(storageError){}
    applyTheme(remoteTheme, true);
  }

  window.addEventListener("storage", function(e){
    if(!e.key){
      // localStorage.clear() fires with key === null. Without this branch the
      // tab keeps the cleared data in memory and writes it back on the next
      // action, silently resurrecting deleted trips.
      commitSessions(loadSessions());
      draft = loadDraft();
      openHistoryId = null;
      renderRecoveryBanner();
      reloadThemeFromStorage();
      if(editingId){
        var stillPresent = false;
        for(var k=0; k<draft.items.length; k++){
          if(draft.items[k].id === editingId){ stillPresent = true; break; }
        }
        if(!stillPresent) exitEdit();
      }
      if(!el.viewToday.hidden) renderDraft();
      if(!el.viewHistory.hidden) renderHistory();
      return;
    }
    if(e.key === SESSIONS_KEY){
      commitSessions(loadSessions());
      renderRecoveryBanner();
      if(!el.viewHistory.hidden) renderHistory();
    }
    if(e.key === DRAFT_KEY){
      draft = loadDraft();
      renderRecoveryBanner();
      if(editingId){
        var exists = false;
        for(var k2=0; k2<draft.items.length; k2++){
          if(draft.items[k2].id === editingId){ exists = true; break; }
        }
        if(!exists) exitEdit();
      }
      if(!el.viewToday.hidden) renderDraft();
    }
    if(e.key === THEME_KEY){
      reloadThemeFromStorage();
    }
  });

  // ---------- version badge / manual update check ----------
  // PAGE_VERSION describes the document that is executing. It is never
  // reassigned: after a background worker update the DOM (and therefore the
  // page identity) is still the old one until the document is replaced, so the
  // badge must not report the new worker's cache name. The worker version is
  // kept separately as a diagnostic in the button's tooltip.
  var PAGE_VERSION = "v10.3";
  var workerVersion = "";
  var swRegistration = null;
  var hadController = Boolean(navigator.serviceWorker && navigator.serviceWorker.controller);
  var updateCheckInProgress = false;
  var UPDATE_CHECK_TIMEOUT_MS = 12000;
  var updateTimeoutTimer = null;
  var updateFound = false;
  var updateWorker = null;
  var updateStateListener = null;

  function shortVersion(v){
    var m = /v(\d+(?:\.\d+)?)\s*$/i.exec(v || "");
    return m ? ("v" + m[1]) : (v || "");
  }

  function renderVersionLabel(v){
    el.versionLabel.textContent = v ? shortVersion(v) : "…";
  }

  function renderVersionTooltip(){
    var tip = "Page " + PAGE_VERSION;
    if(workerVersion) tip += " · Service worker " + shortVersion(workerVersion);
    el.versionBtn.setAttribute("title", tip);
  }

  function requestVersionFromSW(){
    var worker = navigator.serviceWorker.controller || (swRegistration && swRegistration.active);
    if(worker) worker.postMessage({ type:"GET_VERSION" });
  }

  function setUpdating(isUpdating){
    el.versionBtn.disabled = isUpdating;
    if(isUpdating){
      el.versionLabel.textContent = "checking...";
    } else {
      renderVersionLabel(PAGE_VERSION);
    }
  }

  function detachUpdateWorker(){
    if(updateWorker && updateStateListener){
      updateWorker.removeEventListener("statechange", updateStateListener);
    }
    updateWorker = null;
    updateStateListener = null;
  }

  function clearUpdateTimeout(){
    if(updateTimeoutTimer){
      clearTimeout(updateTimeoutTimer);
      updateTimeoutTimer = null;
    }
  }

  // Single terminal path for every update-check outcome. Idempotent: once the
  // flag is cleared, later lifecycle callbacks cannot double-toast or re-lock.
  function finishUpdate(message){
    clearUpdateTimeout();
    detachUpdateWorker();
    if(swRegistration) swRegistration.removeEventListener("updatefound", onUpdateFound);
    updateCheckInProgress = false;
    updateFound = false;
    setUpdating(false);
    if(message) showToast(message);
  }

  function isTerminalWorkerState(state){
    return state === "installed" || state === "activating" || state === "activated" || state === "redundant";
  }

  function onWorkerStateChange(){
    if(!updateCheckInProgress || !updateWorker) return;
    var workerState = updateWorker.state;
    if(workerState === "installed"){
      finishUpdate(navigator.serviceWorker.controller
        ? "Update installed and ready"
        : "Update installed. Reload to start using it.");
    } else if(workerState === "activating" || workerState === "activated"){
      finishUpdate("");
    } else if(workerState === "redundant"){
      finishUpdate("Update installation did not complete");
    }
  }

  function onUpdateFound(){
    updateFound = true;
    if(updateWorker && updateStateListener){
      updateWorker.removeEventListener("statechange", updateStateListener);
    }
    updateWorker = swRegistration.installing;
    updateStateListener = onWorkerStateChange;
    if(updateWorker){
      updateWorker.addEventListener("statechange", updateStateListener);
    }
  }

  // The worker lifecycle is browser-controlled and is not guaranteed to reach a
  // terminal state (stalled download, iOS suspending the PWA). Without a
  // deadline the badge would stay disabled on "installing..." for the session.
  function armUpdateTimeout(){
    clearUpdateTimeout();
    updateTimeoutTimer = setTimeout(function(){
      updateTimeoutTimer = null;
      if(!updateCheckInProgress) return;
      finishUpdate("Still checking for updates in the background.");
    }, UPDATE_CHECK_TIMEOUT_MS);
  }

  if("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("message", function(event){
      if(event.data && event.data.type === "VERSION"){
        workerVersion = event.data.version || "";
        renderVersionTooltip();
      }
    });

    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(hadController){
        // skipWaiting/claim can activate the new worker while this document is
        // still running; tell the truth instead of claiming it is "ready".
        showToast("New version downloaded — reload to start using it");
      }
      hadController = true;
      finishUpdate("");
      requestVersionFromSW();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        swRegistration = reg;
        requestVersionFromSW();
      }).catch(function(){
        el.versionBtn.hidden = true;
      });
    });

    el.versionBtn.addEventListener("click", function(){
      if(!swRegistration || updateCheckInProgress) return;
      updateCheckInProgress = true;
      updateFound = false;
      detachUpdateWorker();
      setUpdating(true);
      armUpdateTimeout();

      swRegistration.addEventListener("updatefound", onUpdateFound);
      swRegistration.update().then(function(){
        swRegistration.removeEventListener("updatefound", onUpdateFound);
        if(!updateCheckInProgress) return;
        if(updateFound){
          if(updateWorker && isTerminalWorkerState(updateWorker.state)){
            onWorkerStateChange();
          } else if(!updateWorker && swRegistration.waiting){
            finishUpdate("An app update is waiting to activate");
          } else if(updateWorker){
            // Installation is still running: keep the lock but re-arm a finite
            // deadline so a stalled install cannot disable the badge forever.
            el.versionBtn.disabled = true;
            el.versionLabel.textContent = "installing...";
            armUpdateTimeout();
            showToast("Update found. Installation is still in progress.");
          } else {
            finishUpdate("Update found; waiting for the browser to finish installation.");
          }
          return;
        }
        if(swRegistration.waiting){
          finishUpdate("An app update is waiting to activate");
          return;
        }
        if(swRegistration.installing){
          finishUpdate("An app update is already installing");
          return;
        }
        // Update detection is throttled by the browser, so do not promise more
        // than was actually observed.
        finishUpdate("No update found right now. Reload if a new version was just deployed.");
      }).catch(function(){
        swRegistration.removeEventListener("updatefound", onUpdateFound);
        finishUpdate("Could not check for updates. Check your connection and retry.");
      });
    });
  } else {
    el.versionBtn.hidden = true;
  }

  // ---------- init ----------
  renderVersionLabel(PAGE_VERSION);
  renderVersionTooltip();
  renderDraft();
})();
</script>
</body>
</html>
