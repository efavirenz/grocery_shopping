<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grocery Receipt — Shopping List</title>
<meta name="description" content="Track grocery items and totals while shopping. View past trip history." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2F6F4E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Grocery" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --paper:#EEF0E7;
    --surface:#FFFFFF;
    --ink:#211F1B;
    --ink-soft:#726F62;
    --green:#2F6F4E;
    --green-dark:#20503A;
    --on-accent:#FFFFFF;
    --red:#B23A2E;
    --line:#CBC7BA;
    --radius:16px;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    color-scheme: light;
  }

  /* Themes */
  body.theme-ocean {
    --green: #2563EB;
    --green-dark: #1D4ED8;
    --paper: #EEF2FF;
  }
  body.theme-sakura {
    --green: #DB2777;
    --green-dark: #9D174D;
    --paper: #FDF2F8;
  }
  body.theme-sunset {
    --green: #EA580C;
    --on-accent: #211F1B;
    --green-dark: #C2410C;
    --paper: #FFF7ED;
  }
  body.theme-grape {
    --green: #7C3AED;
    --green-dark: #6D28D9;
    --paper: #F5F3FF;
  }
  body.theme-dark {
    --on-accent: #211F1B;
    --paper: #1A1A2E;
    --surface: #242438;
    --ink: #E5E5E5;
    --ink-soft: #A1A1AA;
    --green: #4ADE80;
    --green-dark: #22C55E;
    --line: #3F3F56;
    --red: #EF4444;
    color-scheme: dark;
  }
  body.theme-nordic {
    --on-accent: #211F1B;
    --paper: #0F172A;
    --surface: #1E293B;
    --ink: #F8FAFC;
    --ink-soft: #94A3B8;
    --green: #38BDF8;
    --green-dark: #0EA5E9;
    --line: #334155;
    --red: #F87171;
    color-scheme: dark;
  }
  body.theme-mocha {
    --on-accent: #211F1B;
    --paper: #1C1614;
    --surface: #28211E;
    --ink: #F5EBE6;
    --ink-soft: #A89C97;
    --green: #F59E0B;
    --green-dark: #D97706;
    --line: #3D332F;
    --red: #EF4444;
    color-scheme: dark;
  }
  body.theme-amethyst {
    --on-accent: #211F1B;
    --paper: #181226;
    --surface: #241C38;
    --ink: #F3E8FF;
    --ink-soft: #A79BBF;
    --green: #C084FC;
    --green-dark: #A855F7;
    --line: #3B2E58;
    --red: #F87171;
    color-scheme: dark;
  }
  body.theme-cyber {
    --on-accent: #211F1B;
    --paper: #111116;
    --surface: #1A1A22;
    --ink: #FCE7F3;
    --ink-soft: #B2A2AF;
    --green: #FB7185;
    --green-dark: #F43F5E;
    --line: #2D2D3B;
    --red: #FB7185;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    min-height:100vh;
  }

  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

  :focus-visible{ outline:2.5px solid var(--green); outline-offset:2px; }

  button{ font-family:inherit; }

  .shell{
    max-width:520px;
    margin:0 auto;
    padding:18px 16px calc(96px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .header-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .menu-toggle{
    min-width:44px;
    min-height:44px;
    background:transparent;
    border:none;
    font-size:22px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
    padding:4px 6px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .menu-toggle:hover, .menu-toggle:focus-visible{ background:rgba(33,31,27,.08); }
  body.is-dark .menu-toggle:hover, body.theme-dark .menu-toggle:hover{ background:rgba(255,255,255,.1); }

  .wordmark{
    font-family:var(--mono);
    font-weight:600;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--green-dark);
    text-transform:uppercase;
  }
  .header-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
  }
  .today-date{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
  }
  .version-btn{
    min-height:44px;
    display:inline-flex;
    align-items:center;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:11px;
    font-weight:600;
    padding:4px 9px;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .version-btn:active{ background:var(--paper); }
  .version-btn:disabled{ opacity:.7; cursor:default; }

  /* ---------- Drawer Menu ---------- */
  .menu-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0;
    z-index:100;
    display:flex;
    visibility:hidden;
    opacity:0;
    transition:visibility 0.25s, opacity 0.25s;
  }
  .menu-overlay.open{
    visibility:visible;
    opacity:1;
  }
  .menu-backdrop{
    position:absolute; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.45);
  }
  .menu-drawer{
    position:relative;
    width:280px; max-width:82vw;
    height:100%;
    background:var(--surface);
    color:var(--ink);
    box-shadow:4px 0 24px rgba(0,0,0,0.2);
    padding:20px 16px;
    display:flex; flex-direction:column; gap:20px;
    transform:translateX(-100%);
    transition:transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y:auto;
  }
  .menu-overlay.open .menu-drawer{
    transform:translateX(0);
  }
  .menu-header{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:12px; border-bottom:1.5px solid var(--line);
  }
  .menu-title{ font-family:var(--mono); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.08em; }
  .menu-close{ min-width:44px; min-height:44px; background:transparent; border:none; font-size:24px; cursor:pointer; color:var(--ink-soft); padding:0 4px; }
  .menu-section{ display:flex; flex-direction:column; gap:10px; }
  .menu-section-title{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
  .menu-action-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:10px 12px;
    background:var(--paper); border:1.5px solid var(--line);
    border-radius:10px; font-weight:600; font-size:13.5px;
    color:var(--ink); cursor:pointer; text-align:left;
  }
  .menu-action-btn:active{ background:var(--surface); }
  .theme-picker{ display:flex; flex-direction:column; gap:12px; }
  .theme-group{ display:flex; flex-direction:column; gap:6px; }
  .theme-group-title{
    font-family:var(--mono);
    font-size:10.5px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .theme-swatches{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .theme-swatch{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:9px 4px; border:1.5px solid var(--line); border-radius:10px;
    background:var(--paper); cursor:pointer; font-size:11px; font-weight:600;
    color:var(--ink); text-align:center;
    transition:border-color .15s, box-shadow .15s;
  }
  .theme-swatch:active{ background:var(--surface); }
  .theme-swatch.active{ border-color:var(--green); box-shadow:0 0 0 2px var(--green); }
  .swatch-color{ width:22px; height:22px; border-radius:999px; border:1.5px solid rgba(0,0,0,0.15); flex-shrink:0; }
  body.is-dark .swatch-color, body.theme-dark .swatch-color{ border-color:rgba(255,255,255,0.22); }

  .tabs{
    display:flex;
    gap:6px;
    background:rgba(33,31,27,.06);
    padding:4px;
    border-radius:999px;
    margin-bottom:18px;
  }
  body.is-dark .tabs, body.theme-dark .tabs{ background:rgba(255,255,255,.08); }
  .tab{
    min-height:44px;
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab[aria-selected="true"]{
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 1px 3px rgba(33,31,27,.14);
  }

  .recovery-banner{
    background:var(--surface);
    border:1.5px solid var(--red);
    border-radius:12px;
    padding:12px;
    margin:0 0 16px;
    color:var(--ink);
    font-size:13px;
  }
  .recovery-banner p{ margin:0 0 10px; line-height:1.45; overflow-wrap:anywhere; }
  .recovery-actions{ display:flex; flex-wrap:wrap; gap:8px; }
  .recovery-actions button{
    min-height:44px;
    flex:1 1 130px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    background:var(--paper);
    color:var(--ink);
    font:600 12px var(--sans);
    cursor:pointer;
  }
  .recovery-actions button:disabled{ opacity:.55; cursor:not-allowed; }

  /* ---------- Section labels ---------- */
  .section-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 2px 8px;
  }

  /* ---------- Terminal (add-item form) ---------- */
  .terminal{
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:22px;
    box-shadow:0 1px 2px rgba(33,31,27,.06);
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:10px;
    position:relative;
    min-width:0;
  }
  .field label{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .field input{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:16px;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus{ border-color:var(--green); background:var(--surface); }
  .row-2{ display:flex; gap:10px; }
  .row-2 .field-price{ flex:2; min-width:0; }
  .row-2 .field-qty{ flex:1; min-width:0; }
  .field input.mono{ font-family:var(--mono); }

  .suggestions{
    position:absolute;
    top:100%;
    left:0; right:0;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-top:none;
    border-radius:0 0 10px 10px;
    z-index:5;
    box-shadow:0 8px 18px rgba(33,31,27,.12);
    overflow:hidden;
  }
  .suggestions button{
    display:block;
    width:100%;
    text-align:left;
    border:none;
    background:var(--surface);
    padding:10px 12px;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    border-bottom:1px solid var(--paper);
  }
  .suggestions button:last-child{ border-bottom:none; }
  .suggestions button:hover, .suggestions button:focus-visible, .suggestions button.active{ background:var(--paper); }
  body.is-dark .suggestions button.active, body.theme-dark .suggestions button.active{ background:rgba(255,255,255,.08); }
  .suggestions button .sugg-price{ color:var(--ink-soft); font-family:var(--mono); font-size:12px; margin-left:6px; }

  .add-btn{
    width:100%;
    border:none;
    background:var(--green);
    color:var(--on-accent);
    font-weight:700;
    font-size:15px;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-btn:active{ background:var(--green); }
  .add-btn:disabled{ background:#B9C4BB; color:#211F1B; cursor:not-allowed; }
  .add-btn.editing{ background:var(--ink); color:var(--paper); }
  .add-btn.editing:active{ background:var(--ink); }

  .clear-btn{
    width:100%;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-weight:600;
    font-size:13.5px;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    margin-top:8px;
    transition:color .15s, border-color .15s, background-color .15s;
  }
  .clear-btn:hover, .clear-btn:focus-visible{
    color:var(--red);
    border-color:var(--red);
    background:rgba(178,58,46,.06);
  }
  .clear-btn:active{
    background:rgba(178,58,46,.12);
  }
  body.is-dark .clear-btn:hover, body.is-dark .clear-btn:focus-visible,
  body.theme-dark .clear-btn:hover, body.theme-dark .clear-btn:focus-visible{
    color:var(--red);
    border-color:var(--red);
    background:rgba(239,68,68,.12);
  }

  .edit-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:rgba(47,111,78,.09);
    border-radius:99px;
    padding:8px 12px;
    margin-bottom:10px;
    font-size:12.5px;
    color:var(--green-dark);
    font-weight:600;
  }
  .edit-banner[hidden]{ display:none !important; }
  body.is-dark .edit-banner, body.theme-dark .edit-banner{
    background:rgba(255,255,255,.08);
    color:var(--green);
  }
  .edit-banner span{ overflow-wrap:anywhere; }
  .edit-banner button{
    flex-shrink:0;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-weight:700;
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:2px 0;
  }

  /* ---------- Receipt ---------- */
  .receipt-wrap{
    filter:drop-shadow(0 14px 26px rgba(33,31,27,.15));
    margin-bottom:20px;
  }
  .tear{
    height:16px;
    background:var(--surface);
    clip-path:polygon(
      0% 70%, 8.33% 0%, 16.67% 70%, 25% 0%, 33.33% 70%, 41.67% 0%,
      50% 70%, 58.33% 0%, 66.67% 70%, 75% 0%, 83.33% 70%, 91.67% 0%,
      100% 70%, 100% 100%, 0% 100%
    );
  }
  .receipt{
    background:var(--surface);
    border-radius:0 0 4px 4px;
    padding:16px 18px 20px;
  }

  /* Running total above location */
  .running-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:2px 0 8px;
  }
  .running-total-label{
    font-family:var(--mono);
    font-weight:700;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--ink-soft);
  }
  .running-total-amount{
    font-family:var(--mono);
    font-weight:700;
    font-size:22px;
    color:var(--green);
  }

  .loc-field{
    display:flex;
    flex-direction:column;
    gap:3px;
    margin-bottom:12px;
  }
  .loc-field label{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .loc-field input{
    border:none;
    border-bottom:1.5px dashed var(--line);
    padding:4px 2px 8px;
    font-size:16px;
    font-family:var(--sans);
    font-weight:600;
    background:transparent;
    color:var(--ink);
  }
  .loc-field input:focus{ border-color:var(--green); }
  .loc-field input::placeholder{ font-weight:400; color:var(--ink-soft); }

  .divider{ border:none; border-top:1.5px dashed var(--line); margin:12px 0; }

  .items{ list-style:none; margin:0; padding:0; }
  .item-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
  }
  .item-row + .item-row{ border-top:1px dashed var(--line); }
  .item-main{ min-width:0; flex:1; }
  .item-name{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    overflow-wrap:anywhere;
  }
  .item-meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .item-right{
    max-width:62%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .item-subtotal{ font-size:15px; font-weight:600; }
  .item-del, .item-edit{
    width:44px;
    min-width:44px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    padding:4px 2px;
  }
  .item-del{ font-size:18px; }
  .item-del:hover, .item-del:focus-visible{ color:var(--red); }
  .item-edit:hover, .item-edit:focus-visible{ color:var(--green); }

  .item-row.editing{
    background:rgba(47,111,78,.07);
    border-radius:8px;
    margin:0 -8px;
    padding:9px 8px;
  }
  .item-row.editing + .item-row{ border-top:none; }

  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:18px 6px;
  }

  .total-block{ margin-top:6px; }
  .total-rule{ border:none; border-top:2px solid var(--ink); margin-bottom:3px; }
  .total-rule.thin{ border-top-width:1px; margin-bottom:8px; }
  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .total-label{
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--ink-soft);
  }
  .total-amount{
    font-family:var(--mono);
    font-weight:700;
    font-size:26px;
    color:var(--ink);
  }

  /* ---------- Sticky save bar ---------- */
  .save-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 70%, transparent);
  }
  .save-bar-inner{ max-width:520px; margin:0 auto; }
  .save-btn{
    width:100%;
    border:none;
    background:var(--ink);
    color:var(--surface);
    font-weight:700;
    font-size:15px;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(33,31,27,.22);
  }
  .save-btn:disabled{ background:#B7B4A8; box-shadow:none; cursor:not-allowed; }
  .save-hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%; top:14px;
    transform:translate(-50%,-140%);
    background:var(--ink);
    color:var(--surface);
    font-size:13.5px;
    font-weight:600;
    padding:10px 16px;
    border-radius:999px;
    box-shadow:0 10px 24px rgba(33,31,27,.3);
    transition:transform .28s ease;
    z-index:150;
    pointer-events:none;
  }
  .toast.show{ transform:translate(-50%, calc(env(safe-area-inset-top))); }

  /* ---------- Undo Popup ---------- */
  .undo-popup{
    position:fixed;
    left:50%;
    bottom:calc(82px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--surface);
    font-size:13.5px;
    font-weight:600;
    padding:10px 16px;
    border-radius:12px;
    box-shadow:0 8px 24px rgba(33,31,27,.28);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:160;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease, transform .25s ease, visibility .25s ease;
    max-width:calc(100vw - 32px);
    box-sizing:border-box;
  }
  .undo-popup[hidden]{ display:none !important; }
  .undo-popup.show{
    opacity:1;
    visibility:visible;
    transform:translateX(-50%) translateY(0);
  }
  .undo-popup .undo-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
    flex:1;
  }
  .undo-popup .undo-btn{
    border:none;
    background:rgba(255,255,255,0.18);
    color:#FFFFFF;
    font-weight:700;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    padding:4px 10px;
    border-radius:6px;
    flex-shrink:0;
  }
  .undo-popup .undo-btn:active{
    background:rgba(255,255,255,0.3);
  }
  body.is-dark .undo-popup, body.theme-dark .undo-popup{
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--ink);
  }

  /* ---------- History ---------- */
  .stub-wrap{ margin-bottom:14px; filter:drop-shadow(0 6px 14px rgba(33,31,27,.10)); }
  .stub-tear{
    height:10px;
    background:var(--surface);
    clip-path:polygon(
      0% 60%, 12.5% 0%, 25% 60%, 37.5% 0%, 50% 60%, 62.5% 0%, 75% 60%, 87.5% 0%,
      100% 60%, 100% 100%, 0% 100%
    );
  }
  .stub{
    background:var(--surface);
    border-radius:0 0 4px 4px;
    padding:12px 14px;
  }
  .stub-top{
    min-height:44px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    background:transparent;
    border:none;
    width:100%;
    text-align:left;
    padding:0;
    color:inherit;
    font-family:inherit;
  }
  .stub-summary-left{ min-width:0; }
  .stub-summary-right{ text-align:right; }
  .stub-loc{ display:block; font-size:15px; font-weight:700; overflow-wrap:anywhere; }
  .stub-date{ display:block; font-size:12px; color:var(--ink-soft); font-family:var(--mono); margin-top:2px; }
  .stub-total{ display:block; font-family:var(--mono); font-weight:700; font-size:16px; white-space:nowrap; }
  .stub-count{ display:block; font-size:11px; color:var(--ink-soft); text-align:right; margin-top:2px; }

  .stub-detail{ margin-top:10px; }
  .stub-detail[hidden]{ display:none; }
  .stub-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .stub-actions button{
    min-height:44px;
    flex:1;
    border:1.5px solid var(--line);
    background:var(--surface);
    padding:8px;
    border-radius:99px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }
  .stub-actions .danger{ color:var(--red); border-color:#E7C9C4; }
  body.is-dark .stub-actions .danger, body.theme-dark .stub-actions .danger{ border-color:rgba(239,68,68,.4); }

  .history-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:40px 20px;
    line-height:1.6;
  }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggleBtn" type="button" aria-label="Open menu">&#9776;</button>
      <span class="wordmark">Grocery Receipt</span>
    </div>
    <div class="header-right">
      <button class="version-btn mono" id="versionBtn" type="button" aria-label="Check for updates">
        <span id="versionLabel">…</span>
      </button>
      <span class="today-date mono" id="todayDate"></span>
    </div>
  </header>

  <!-- Side Drawer Menu -->
  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <div class="menu-backdrop" id="menuBackdrop"></div>
    <div class="menu-drawer" role="dialog" aria-modal="true" aria-label="Settings and Backup Menu">
      <div class="menu-header">
        <span class="menu-title">Menu</span>
        <button class="menu-close" id="menuCloseBtn" type="button" aria-label="Close menu">&times;</button>
      </div>

      <div class="menu-section">
        <span class="menu-section-title">Data Backup</span>
        <button class="menu-action-btn" id="exportBtn" type="button">
          <span>&#128229;</span> Export History (JSON)
        </button>
        <button class="menu-action-btn" id="importBtn" type="button">
          <span>&#128228;</span> Import History (JSON)
        </button>
        <input type="file" id="importFileInput" accept=".json" hidden />
      </div>

      <div class="menu-section">
        <span class="menu-section-title">Color Theme</span>
        <div class="theme-picker" id="themeSwatches"></div>
      </div>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Shopping views">
    <button class="tab" id="tabToday" type="button" role="tab" aria-selected="true" aria-controls="viewToday" tabindex="0">Today</button>
    <button class="tab" id="tabHistory" type="button" role="tab" aria-selected="false" aria-controls="viewHistory" tabindex="-1">History</button>
  </div>

  <div class="recovery-banner" id="recoveryBanner" role="alert" hidden>
    <p id="recoveryMessage"></p>
    <div class="recovery-actions">
      <button type="button" id="recoveryExportBtn">Download raw backup</button>
      <button type="button" id="recoveryContinueBtn">Continue after backup</button>
    </div>
  </div>

  <!-- ============ TODAY VIEW ============ -->
  <section id="viewToday" role="tabpanel" aria-labelledby="tabToday" tabindex="0">
    <p class="section-label">Add Item</p>
    <div class="terminal">
      <div class="field" id="nameFieldWrap">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" placeholder="e.g. Eggs, Milk" autocomplete="off" maxlength="150" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" aria-controls="suggestions" />
        <div class="suggestions" id="suggestions" role="listbox" hidden></div>
      </div>
      <div class="row-2">
        <div class="field field-price">
          <label for="itemPrice">Price (฿)</label>
          <input type="number" id="itemPrice" class="mono" placeholder="0.00" inputmode="decimal" min="0" step="0.01" />
        </div>
        <div class="field field-qty">
          <label for="itemQty">Qty</label>
          <input type="number" id="itemQty" class="mono" value="1" inputmode="numeric" min="1" step="1" />
        </div>
      </div>
      <div class="edit-banner" id="editBanner" hidden>
        <span id="editBannerText"></span>
        <button type="button" id="cancelEditBtn">Cancel</button>
      </div>
      <button class="add-btn" id="addBtn">+ Add Item</button>
      <button type="button" class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <p class="section-label">Today's Receipt</p>
    <div class="receipt-wrap">
      <div class="tear"></div>
      <div class="receipt">
        <div class="running-total">
          <span class="running-total-label">RUNNING TOTAL</span>
          <span class="running-total-amount mono" id="runningTotalAmount">฿0.00</span>
        </div>
        <hr class="divider" />
        <div class="loc-field">
          <label for="locationInput">Location</label>
          <input type="text" id="locationInput" placeholder="Store or supermarket name" maxlength="100" />
        </div>
        <hr class="divider" />
        <ul class="items" id="itemsList"></ul>
        <div id="emptyNote" class="empty-note">No items yet. Add your first item above.</div>
        <div class="total-block">
          <hr class="total-rule" />
          <hr class="total-rule thin" />
          <div class="total-row">
            <span class="total-label">TOTAL</span>
            <span class="total-amount mono" id="totalAmount">฿0.00</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ HISTORY VIEW ============ -->
  <section id="viewHistory" role="tabpanel" aria-labelledby="tabHistory" tabindex="0" hidden>
    <p class="section-label">Shopping History</p>
    <div id="historyList"></div>
    <div id="historyEmpty" class="history-empty" hidden>
      No shopping history yet.<br />Save your first trip from the "Today" tab.
    </div>
  </section>
</div>

<div class="save-bar" id="saveBarToday">
  <div class="save-bar-inner">
    <button class="save-btn" id="saveBtn" disabled>Save Today's List</button>
    <div class="save-hint" id="saveHint">Add at least 1 item before saving</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="undo-popup" id="undoPopup" role="status" aria-live="polite" hidden>
  <span class="undo-text" id="undoPopupText"></span>
  <button type="button" class="undo-btn" id="undoBtn">Undo</button>
</div>

<script>
(function(){
  "use strict";

  var SESSIONS_KEY = "grocery_sessions_v1";
  var DRAFT_KEY = "grocery_draft_v1";
  var THEME_KEY = "grocery_theme_v1";
  var storageRecovery = [];
  var recoveryReplacements = {};
  var storageWriteLocked = false;

  // ---------- storage recovery & validation ----------
  var cachedKnownItems = null;
  function invalidateKnownItems(){ cachedKnownItems = null; }

  function registerStorageIssue(key, raw, reason, replacement){
    var existing = null;
    for(var i=0; i<storageRecovery.length; i++){
      if(storageRecovery[i].key === key){ existing = storageRecovery[i]; break; }
    }
    recoveryReplacements[key] = replacement;
    if(existing){
      existing.raw = raw;
      existing.reason = reason;
      existing.backupVerified = false;
    } else {
      existing = {
        key: key,
        raw: raw,
        reason: reason,
        backupKey: "grocery_recovery_" + key + "_v1",
        backupVerified: false
      };
      storageRecovery.push(existing);
    }
    storageWriteLocked = true;
    recoveryExportCreated = false;
    if(raw !== null){
      try{
        var prior = localStorage.getItem(existing.backupKey);
        if(prior === raw){
          existing.backupVerified = true;
        } else if(prior === null){
          localStorage.setItem(existing.backupKey, raw);
          existing.backupVerified = localStorage.getItem(existing.backupKey) === raw;
        }
      }catch(e){}
    }
  }

  function readStorageRaw(key, fallback){
    try{
      return { ok:true, raw:localStorage.getItem(key) };
    }catch(e){
      registerStorageIssue(key, null, "Browser storage could not be read (" + (e && e.name ? e.name : "access error") + ").", fallback);
      return { ok:false, raw:null };
    }
  }

  function parseStrictNumber(value){
    var num;
    if(typeof value === "number"){
      num = value;
    } else if(typeof value === "string" && /^[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?$/i.test(value.trim())){
      num = Number(value);
    } else {
      return NaN;
    }
    return isFinite(num) ? num : NaN;
  }

  function uid(){
    if(typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"){
      return crypto.randomUUID();
    }
    return Date.now().toString(36) + "-" +
      Math.random().toString(36).slice(2) + "-" +
      Math.random().toString(36).slice(2) + "-" +
      Math.random().toString(36).slice(2);
  }

  function uniqueUid(used){
    var base = uid();
    var id = base;
    var suffix = 1;
    while(used && used[id]){
      id = base + "-" + suffix;
      suffix++;
    }
    if(used) used[id] = true;
    return id;
  }

  function uniqueItemId(items){
    var used = Object.create(null);
    for(var i=0; i<items.length; i++) used[items[i].id] = true;
    return uniqueUid(used);
  }

  function uniqueSessionId(list){
    var used = Object.create(null);
    for(var i=0; i<list.length; i++) used[list[i].id] = true;
    return uniqueUid(used);
  }

  function validateItem(i){
    if(!i || typeof i !== "object") return null;
    var name = typeof i.name === "string" ? i.name.trim().slice(0, 150) : "";
    var rawPrice = parseStrictNumber(i.price);
    var rawQty = parseStrictNumber(i.qty);
    if(!name || !isFinite(rawPrice) || rawPrice < 0 || rawPrice > 10000000) return null;
    if(!isFinite(rawQty) || rawQty < 1 || Math.floor(rawQty) !== rawQty) return null;
    var price = roundMoney(rawPrice);
    if(!isFinite(price)) return null;
    return {
      id: (typeof i.id === "string" && i.id.trim()) ? i.id.trim() : uid(),
      name: name,
      price: price,
      qty: rawQty
    };
  }

  function validateSession(s, usedSessionIds){
    if(!s || typeof s !== "object" || !Array.isArray(s.items) || s.items.length === 0) return null;
    var validItems = [];
    var usedItemIds = Object.create(null);
    for(var j=0; j<s.items.length; j++){
      var item = validateItem(s.items[j]);
      if(item){
        if(usedItemIds[item.id]) item.id = uniqueUid(usedItemIds);
        else usedItemIds[item.id] = true;
        validItems.push(item);
      }
    }
    if(validItems.length === 0) return null;

    var dateValue = NaN;
    if(typeof s.date === "string" && s.date.trim()) dateValue = new Date(s.date).getTime();
    else if(typeof s.date === "number" && isFinite(s.date)) dateValue = new Date(s.date).getTime();
    var d = isFinite(dateValue) ? new Date(dateValue).toISOString() : null;
    var loc = typeof s.location === "string" && s.location.trim() ? s.location.trim().slice(0, 100) : "Unspecified Location";
    var sessionId = (typeof s.id === "string" && s.id.trim()) ? s.id.trim() : uid();
    if(usedSessionIds){
      if(usedSessionIds[sessionId]) sessionId = uniqueUid(usedSessionIds);
      else usedSessionIds[sessionId] = true;
    }
    var sessionTotal = total(validItems);
    if(!isFinite(sessionTotal)) return null;
    return {
      id: sessionId,
      date: d,
      location: loc,
      items: validItems,
      total: sessionTotal
    };
  }

  function loadSessions(){
    var result = readStorageRaw(SESSIONS_KEY, []);
    if(!result.ok || result.raw === null) return [];
    var parsed;
    try{
      parsed = JSON.parse(result.raw);
    }catch(e){
      registerStorageIssue(SESSIONS_KEY, result.raw, "Shopping history contains invalid JSON.", []);
      return [];
    }
    if(!Array.isArray(parsed)){
      registerStorageIssue(SESSIONS_KEY, result.raw, "Shopping history has an invalid data structure.", []);
      return [];
    }
    var sanitized = [];
    var invalidCount = 0;
    var usedSessionIds = Object.create(null);
    for(var i=0; i<parsed.length; i++){
      var valid = validateSession(parsed[i], usedSessionIds);
      if(valid){
        sanitized.push(valid);
        if(!parsed[i] || !Array.isArray(parsed[i].items) || valid.items.length !== parsed[i].items.length) invalidCount++;
      } else {
        invalidCount++;
      }
    }
    if(invalidCount > 0){
      registerStorageIssue(SESSIONS_KEY, result.raw, invalidCount + " invalid history record(s) or item(s) were skipped. The original data is preserved for recovery.", sanitized);
    }
    return sanitized;
  }

  function saveSessions(list){
    if(storageWriteLocked){
      showToast("Recover stored data before saving changes");
      return false;
    }
    try{
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
      invalidateKnownItems();
      return true;
    }catch(e){
      if(e && (e.name === "QuotaExceededError" || e.code === 22)){
        showToast("⚠️ Storage full: export & delete old trips");
      } else {
        showToast("Could not save shopping history");
      }
      return false;
    }
  }

  function loadDraft(){
    var emptyDraft = { location:"", items:[] };
    var result = readStorageRaw(DRAFT_KEY, emptyDraft);
    if(!result.ok || result.raw === null) return emptyDraft;
    var parsed;
    try{
      parsed = JSON.parse(result.raw);
    }catch(e){
      registerStorageIssue(DRAFT_KEY, result.raw, "Today's draft contains invalid JSON.", emptyDraft);
      return emptyDraft;
    }
    if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.items)){
      registerStorageIssue(DRAFT_KEY, result.raw, "Today's draft has an invalid data structure.", emptyDraft);
      return emptyDraft;
    }
    var validItems = [];
    var invalidCount = 0;
    var usedIds = Object.create(null);
    for(var i=0; i<parsed.items.length; i++){
      var item = validateItem(parsed.items[i]);
      if(item){
        if(usedIds[item.id]) item.id = uniqueUid(usedIds);
        else usedIds[item.id] = true;
        validItems.push(item);
      } else {
        invalidCount++;
      }
    }
    var loaded = {
      location: typeof parsed.location === "string" ? parsed.location.slice(0, 100) : "",
      items: validItems,
      pendingSavedSessionId: typeof parsed.pendingSavedSessionId === "string" ? parsed.pendingSavedSessionId : null
    };
    if(invalidCount > 0 || (parsed.location !== undefined && typeof parsed.location !== "string")){
      registerStorageIssue(DRAFT_KEY, result.raw, invalidCount + " invalid draft item(s) or fields were skipped. The original data is preserved for recovery.", loaded);
    }
    return loaded;
  }

  function saveDraft(d){
    if(storageWriteLocked){
      showToast("Recover stored data before saving changes");
      return false;
    }
    try{
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
      return true;
    }catch(e){
      if(e && (e.name === "QuotaExceededError" || e.code === 22)){
        showToast("⚠️ Storage full: draft cannot be saved");
      } else {
        showToast("Could not save today's draft");
      }
      return false;
    }
  }

  function cloneDraft(source){
    var copy = {
      location:source.location || "",
      items:[],
      pendingSavedSessionId:source.pendingSavedSessionId || null
    };
    for(var i=0; i<source.items.length; i++){
      copy.items.push({
        id:source.items[i].id,
        name:source.items[i].name,
        price:source.items[i].price,
        qty:source.items[i].qty
      });
    }
    return copy;
  }

  function cloneSessions(source){
    var copy = [];
    for(var i=0; i<source.length; i++){
      var session = source[i];
      var items = [];
      for(var j=0; j<session.items.length; j++){
        items.push({
          id:session.items[j].id,
          name:session.items[j].name,
          price:session.items[j].price,
          qty:session.items[j].qty
        });
      }
      copy.push({
        id:session.id,
        date:session.date,
        location:session.location,
        items:items,
        total:session.total
      });
    }
    return copy;
  }

  function roundMoney(n){
    var num = Number(n);
    if(!isFinite(num)) return NaN;
    if(Math.abs(num) >= 100000000000000) return num;
    var sign = num < 0 ? -1 : 1;
    return sign * Number(Math.round(Number(Math.abs(num) + "e+2")) + "e-2");
  }
  function money(n){
    var num = roundMoney(n);
    if(!isFinite(num)) return "฿—";
    var sign = num < 0 ? "-" : "";
    return sign + "฿" + Math.abs(num).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  function subtotal(item){
    var result = roundMoney(item.price * item.qty);
    return isFinite(result) ? result : NaN;
  }
  function total(items){
    var sum = 0;
    for(var i=0; i<items.length; i++){
      var line = subtotal(items[i]);
      if(!isFinite(line)) return NaN;
      sum = roundMoney(sum + line);
      if(!isFinite(sum)) return NaN;
    }
    return sum;
  }

  function sortSessionsByDate(list){
    list.sort(function(a, b){
      var aTime = a.date ? new Date(a.date).getTime() : NaN;
      var bTime = b.date ? new Date(b.date).getTime() : NaN;
      var aKnown = isFinite(aTime);
      var bKnown = isFinite(bTime);
      if(aKnown && bKnown) return bTime - aTime;
      if(aKnown) return -1;
      if(bKnown) return 1;
      return 0;
    });
    return list;
  }

  var dateFmt = new Intl.DateTimeFormat("en-US", { day:"numeric", month:"short", year:"numeric" });
  var dateTimeFmt = new Intl.DateTimeFormat("en-US", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });

  function formatDateTimeSafe(dateStr){
    if(!dateStr) return "Unknown date";
    try{
      var d = new Date(dateStr);
      if(isNaN(d.getTime())) return "Unknown date";
      return dateTimeFmt.format(d);
    }catch(e){
      return "Unknown date";
    }
  }

  // ---------- state ----------
  var sessions = sortSessionsByDate(loadSessions());
  var draft = loadDraft();
  var editingId = null;

  // ---------- DOM refs ----------
  var el = {
    todayDate: document.getElementById("todayDate"),
    versionBtn: document.getElementById("versionBtn"),
    versionLabel: document.getElementById("versionLabel"),
    tabToday: document.getElementById("tabToday"),
    tabHistory: document.getElementById("tabHistory"),
    viewToday: document.getElementById("viewToday"),
    viewHistory: document.getElementById("viewHistory"),
    saveBarToday: document.getElementById("saveBarToday"),

    itemName: document.getElementById("itemName"),
    itemPrice: document.getElementById("itemPrice"),
    itemQty: document.getElementById("itemQty"),
    addBtn: document.getElementById("addBtn"),
    clearBtn: document.getElementById("clearBtn"),
    suggestions: document.getElementById("suggestions"),
    editBanner: document.getElementById("editBanner"),
    editBannerText: document.getElementById("editBannerText"),
    cancelEditBtn: document.getElementById("cancelEditBtn"),

    runningTotalAmount: document.getElementById("runningTotalAmount"),
    locationInput: document.getElementById("locationInput"),
    itemsList: document.getElementById("itemsList"),
    emptyNote: document.getElementById("emptyNote"),
    totalAmount: document.getElementById("totalAmount"),

    saveBtn: document.getElementById("saveBtn"),
    saveHint: document.getElementById("saveHint"),

    historyList: document.getElementById("historyList"),
    historyEmpty: document.getElementById("historyEmpty"),

    toast: document.getElementById("toast"),
    undoPopup: document.getElementById("undoPopup"),
    undoPopupText: document.getElementById("undoPopupText"),
    undoBtn: document.getElementById("undoBtn"),

    menuToggleBtn: document.getElementById("menuToggleBtn"),
    menuCloseBtn: document.getElementById("menuCloseBtn"),
    menuBackdrop: document.getElementById("menuBackdrop"),
    menuOverlay: document.getElementById("menuOverlay"),
    exportBtn: document.getElementById("exportBtn"),
    importBtn: document.getElementById("importBtn"),
    importFileInput: document.getElementById("importFileInput"),
    themeSwatches: document.getElementById("themeSwatches"),
    recoveryBanner: document.getElementById("recoveryBanner"),
    recoveryMessage: document.getElementById("recoveryMessage"),
    recoveryExportBtn: document.getElementById("recoveryExportBtn"),
    recoveryContinueBtn: document.getElementById("recoveryContinueBtn")
  };

  el.todayDate.textContent = dateFmt.format(new Date());

  var recoveryExportCreated = false;

  function renderRecoveryBanner(){
    if(storageRecovery.length === 0){
      el.recoveryBanner.hidden = true;
      return;
    }
    var descriptions = [];
    var canContinue = true;
    var hasRaw = false;
    for(var i=0; i<storageRecovery.length; i++){
      descriptions.push(storageRecovery[i].key + ": " + storageRecovery[i].reason);
      if(storageRecovery[i].raw === null) canContinue = false;
      if(storageRecovery[i].raw !== null) hasRaw = true;
      if(!storageRecovery[i].backupVerified && !recoveryExportCreated) canContinue = false;
    }
    el.recoveryMessage.textContent = "Stored data needs recovery. Saving is paused to protect the original data. " + descriptions.join(" ");
    el.recoveryBanner.hidden = false;
    el.recoveryExportBtn.disabled = !hasRaw;
    el.recoveryContinueBtn.disabled = !canContinue;
  }

  function downloadRecoveryBackup(){
    var records = [];
    for(var i=0; i<storageRecovery.length; i++){
      records.push({
        key:storageRecovery[i].key,
        reason:storageRecovery[i].reason,
        raw:storageRecovery[i].raw
      });
    }
    var payload = {
      type:"grocery-storage-recovery",
      createdAt:new Date().toISOString(),
      records:records
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    try{
      var a = document.createElement("a");
      a.href = url;
      a.download = "grocery_storage_recovery_" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      recoveryExportCreated = true;
      showToast("Raw recovery backup download started");
    }catch(e){
      showToast("Could not start recovery backup download");
    }finally{
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }
    renderRecoveryBanner();
  }

  function continueAfterRecovery(){
    if(storageRecovery.length === 0) return;
    for(var i=0; i<storageRecovery.length; i++){
      if(storageRecovery[i].raw === null || (!storageRecovery[i].backupVerified && !recoveryExportCreated)){
        showToast("Download the raw recovery backup before continuing");
        return;
      }
    }
    if(!confirm("The original data has been backed up. Continue with the validated data available to this app?")) return;
    try{
      for(var j=0; j<storageRecovery.length; j++){
        var record = storageRecovery[j];
        var replacement = recoveryReplacements[record.key];
        var serialized = JSON.stringify(replacement);
        localStorage.setItem(record.key, serialized);
        if(localStorage.getItem(record.key) !== serialized){
          throw new Error("Recovery verification failed for " + record.key);
        }
      }
      if(recoveryReplacements[SESSIONS_KEY]){
        sessions = sortSessionsByDate(recoveryReplacements[SESSIONS_KEY]);
        invalidateKnownItems();
      }
      if(recoveryReplacements[DRAFT_KEY]){
        draft = recoveryReplacements[DRAFT_KEY];
      }
      storageRecovery = [];
      recoveryReplacements = {};
      storageWriteLocked = false;
      recoveryExportCreated = false;
      renderRecoveryBanner();
      renderDraft();
      if(!el.viewHistory.hidden) renderHistory();
      showToast("Stored data recovery completed");
    }catch(e){
      showToast("Recovery could not be verified. Original backup remains available.");
      renderRecoveryBanner();
    }
  }

  function applyTheme(themeId, skipPersist){

    if(!selectedTheme && themes.length > 0){

      themeId = "default";

    if(themeId !== "default"){
      document.body.classList.add("theme-" + themeId);

    if(selectedTheme && selectedTheme.isDark){
      document.body.classList.add("is-dark");
    } else {
      document.body.classList.remove("is-dark");
    }
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    if(metaTheme){
      metaTheme.setAttribute("content", themeMetaColors[themeId] || themeMetaColors["default"]);
    }
    if(!skipPersist){
      try{ localStorage.setItem(THEME_KEY, themeId); }catch(e){}

  el.exportBtn.addEventListener("click", function(){
    if(sessions.length === 0){
      showToast("No history data to export");
      return;
    }
    var exportData = {
      version: 1,
      exportedAt: new Date().toISOString(),
      sessions: sessions
    };
    var jsonStr = JSON.stringify(exportData, null, 2);
    var dateStr = new Date().toISOString().slice(0,10);
    var fileName = "grocery_history_" + dateStr + ".json";
    var blob = new Blob([jsonStr], { type: "application/json" });

    if(navigator.canShare && typeof File !== "undefined"){
      try{
        var file = new File([blob], fileName, { type: "application/json" });
        if(navigator.canShare({ files: [file] })){
          navigator.share({
            files: [file],
            title: "Grocery Shopping History",
            text: "Grocery shopping trip history backup"
          }).then(function(){
            showToast("History shared successfully");
            closeMenu();
          }).catch(function(err){
            if(err && err.name !== "AbortError"){
              downloadFileFallback(blob, fileName);
            }
          });
          return;
        }
      }catch(e){}
    }
    downloadFileFallback(blob, fileName);
  });

  el.importBtn.addEventListener("click", function(){

  el.importFileInput.addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 5 * 1024 * 1024){
      showToast("File too large (max 5MB)");
      el.importFileInput.value = "";
      return;
    }
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        var importedSessions = Array.isArray(data) ? data : (data && Array.isArray(data.sessions) ? data.sessions : null);
        if(!importedSessions){
          showToast("Invalid JSON file format");
          el.importFileInput.value = "";
          return;
        }
        if(storageWriteLocked){
          showToast("Recover stored data before importing history");
          el.importFileInput.value = "";
          return;
        }

        var existingMap = Object.create(null);
        sessions.forEach(function(s){ existingMap[s.id] = true; });
        var nextSessions = cloneSessions(sessions);
        var addedCount = 0;
        var skippedCount = 0;
        importedSessions.forEach(function(raw){
          var valid = validateSession(raw);
          if(!valid){
            skippedCount++;
            return;
          }
          if(existingMap[valid.id]){
            skippedCount++;
            return;
          }
          nextSessions.push(valid);
          existingMap[valid.id] = true;
          addedCount++;
        });
        sortSessionsByDate(nextSessions);
        if(!saveSessions(nextSessions)){
          el.importFileInput.value = "";
          return;
        }
        sessions = nextSessions;
        invalidateKnownItems();
        showToast("Imported " + addedCount + " trip(s); skipped " + skippedCount);
        if(!el.viewHistory.hidden) renderHistory();
        closeMenu();
      }catch(err){
        showToast("Error parsing JSON file");
      }
      el.importFileInput.value = "";
    };
    reader.readAsText(file);
  });

  el.undoBtn.addEventListener("click", function(){

        draft.items[i].price = lastEditedSnapshot.price;
        draft.items[i].qty = lastEditedSnapshot.qty;

        price: lastEditedSnapshot.price,
        qty: lastEditedSnapshot.qty
      });

    if(!persistDraft(previousDraft)){
      showToast("Undo was not saved. Your previous list was restored.");

  function addItem(){
    var name = el.itemName.value.trim().slice(0, 150);
    var price = parseStrictNumber(el.itemPrice.value);
    var qty = parseStrictNumber(el.itemQty.value);

    if(!name){ el.itemName.focus(); return; }
    if(!isFinite(price) || price < 0 || price > 10000000){
      showToast("Please enter a valid price (0 - 10,000,000)");
      el.itemPrice.focus();
      return;
    }
    if(!isFinite(qty) || qty < 1 || Math.floor(qty) !== qty){
      showToast("Please enter a whole quantity of 1 or more");
      el.itemQty.focus();
      return;
    }

    price = roundMoney(price);
    if(!isFinite(price)){
      showToast("The price is outside the supported numeric range");
      el.itemPrice.focus();
      return;
    }

    var candidate = cloneDraft(draft);
    candidate.pendingSavedSessionId = null;
    var previousItem = null;
    var wasEditing = Boolean(editingId);
    if(wasEditing){
      var idx = -1;
      for(var i=0; i<candidate.items.length; i++){
        if(candidate.items[i].id === editingId){ idx = i; break; }
      }
      if(idx !== -1){
        previousItem = {
          id:candidate.items[idx].id,
          name:candidate.items[idx].name,
          price:candidate.items[idx].price,
          qty:candidate.items[idx].qty
        };
        candidate.items[idx].name = name;
        candidate.items[idx].price = price;
        candidate.items[idx].qty = qty;
      } else {
        candidate.items.push({ id:uniqueItemId(candidate.items), name:name, price:price, qty:qty });
      }
    } else {
      candidate.items.push({ id:uniqueItemId(candidate.items), name:name, price:price, qty:qty });
    }

    if(!isFinite(total(candidate.items))){
      showToast("This quantity would make the total exceed the supported numeric range");
      el.itemQty.focus();
      return;
    }

    cancelLocationSave();
    if(!saveDraft(candidate)) return;
    draft = candidate;
    if(wasEditing){
      exitEdit();
    } else {
      clearForm();
      el.itemName.focus();
    }
    if(previousItem) showUndoPopup(previousItem, name);
    renderDraft();
  }

    candidate.items = candidate.items.filter(function(i){ return i.id !== id; });
    candidate.pendingSavedSessionId = null;
    if(candidate.items.length === oldLength) return;

    cancelLocationSave();

    renderDraft();

  // ---------- autocomplete (memoized & keyboard accessible) ----------
  var activeSuggIndex = -1;
  var currentSuggestions = [];

  function knownItems(){
    if(cachedKnownItems) return cachedKnownItems;
    var map = Object.create(null);
    var all = [];
    sessions.forEach(function(s){
      if(Array.isArray(s.items)){
        s.items.forEach(function(i){ all.push({ item:i, when:s.date }); });
      }
    });
    all.sort(function(a,b){
      var timeA = new Date(a.when).getTime() || 0;
      var timeB = new Date(b.when).getTime() || 0;
      return timeB - timeA;
    });
    all.forEach(function(rec){
      var key = rec.item.name.trim().toLowerCase();
      if(!map[key]) map[key] = rec.item;
    });
    cachedKnownItems = Object.keys(map).map(function(k){ return map[k]; });
    return cachedKnownItems;
  }

  function closeSuggestions(){
    el.suggestions.hidden = true;
    el.suggestions.innerHTML = "";
    el.itemName.setAttribute("aria-expanded", "false");
    el.itemName.removeAttribute("aria-activedescendant");
    activeSuggIndex = -1;
    currentSuggestions = [];
  }

  function updateSuggestionSelection(){
    var buttons = el.suggestions.querySelectorAll("button");
    for(var i=0; i<buttons.length; i++){
      if(i === activeSuggIndex){
        buttons[i].classList.add("active");
        buttons[i].setAttribute("aria-selected", "true");
        el.itemName.setAttribute("aria-activedescendant", buttons[i].id);
        if(typeof buttons[i].scrollIntoView === "function"){
          buttons[i].scrollIntoView({ block:"nearest" });
        }
      } else {
        buttons[i].classList.remove("active");
        buttons[i].setAttribute("aria-selected", "false");
      }
    }
    if(activeSuggIndex < 0){
      el.itemName.removeAttribute("aria-activedescendant");
    }
  }

  function selectSuggestion(item){
    el.itemName.value = item.name;
    el.itemPrice.value = item.price;
    closeSuggestions();
    el.itemPrice.focus();
    try{ el.itemPrice.select(); }catch(err){}
  }

  el.itemName.addEventListener("input", function(){
    var q = el.itemName.value.trim().toLowerCase();
    if(!q){ closeSuggestions(); return; }
    var matches = knownItems().filter(function(i){
      return i.name.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 5);

    if(matches.length === 0){ closeSuggestions(); return; }

    currentSuggestions = matches;
    activeSuggIndex = -1;
    el.suggestions.innerHTML = "";
    matches.forEach(function(m, idx){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("role", "option");
      btn.setAttribute("aria-selected", "false");
      btn.id = "sugg-option-" + idx;
      btn.innerHTML = '<span></span><span class="sugg-price mono"></span>';
      btn.querySelector("span").textContent = m.name;
      btn.querySelector(".sugg-price").textContent = money(m.price);
      btn.addEventListener("pointerdown", function(e){
        e.preventDefault();
        selectSuggestion(m);
      });
      btn.addEventListener("click", function(){ selectSuggestion(m); });
      el.suggestions.appendChild(btn);
    });
    el.suggestions.hidden = false;
    el.itemName.setAttribute("aria-expanded", "true");
  });

  el.itemName.addEventListener("keydown", function(e){
    if(!el.suggestions.hidden && currentSuggestions.length > 0){
      if(e.key === "ArrowDown"){
        e.preventDefault();
        activeSuggIndex = (activeSuggIndex + 1) % currentSuggestions.length;
        updateSuggestionSelection();
        return;
      }
      if(e.key === "ArrowUp"){
        e.preventDefault();
        if(activeSuggIndex <= 0){
          activeSuggIndex = currentSuggestions.length - 1;
        } else {
          activeSuggIndex--;
        }
        updateSuggestionSelection();
        return;
      }
      if(e.key === "Enter" && activeSuggIndex >= 0 && activeSuggIndex < currentSuggestions.length){
        e.preventDefault();
        selectSuggestion(currentSuggestions[activeSuggIndex]);
        return;
      }
      if(e.key === "Escape"){
        e.preventDefault();
        closeSuggestions();
        return;
      }
    }
    if(e.key === "Enter"){
      e.preventDefault();
      addItem();
    }
  });

  [el.itemPrice, el.itemQty].forEach(function(input){
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); addItem(); }
    });
  });

  document.getElementById("nameFieldWrap").addEventListener("focusout", function(e){
    if(!document.getElementById("nameFieldWrap").contains(e.relatedTarget)){
      closeSuggestions();
    }
  });

  document.addEventListener("click", function(e){
    if(!document.getElementById("nameFieldWrap").contains(e.target)) closeSuggestions();
  });

  // ---------- save trip ----------
  function findPendingSavedSession(currentDraft){
    if(!currentDraft.pendingSavedSessionId) return null;
    var pending = null;
    for(var i=0; i<sessions.length; i++){
      if(sessions[i].id === currentDraft.pendingSavedSessionId){
        pending = sessions[i];
        break;
      }
    }
    if(!pending || pending.items.length !== currentDraft.items.length) return null;
    var draftLocation = (currentDraft.location || "").trim() || "Unspecified Location";
    if(pending.location !== draftLocation) return null;
    for(var j=0; j<pending.items.length; j++){
      var savedItem = pending.items[j];
      var draftItem = currentDraft.items[j];
      if(savedItem.id !== draftItem.id || savedItem.name !== draftItem.name ||
         savedItem.price !== draftItem.price || savedItem.qty !== draftItem.qty) return null;
    }
    return pending;
  }

  el.saveBtn.addEventListener("click", function(){
    if(draft.items.length === 0) return;
    var previousDraft = cloneDraft(draft);
    var existingSavedSession = findPendingSavedSession(draft);
    if(existingSavedSession){
      var clearedDraft = { location:"", items:[] };
      cancelLocationSave();
      if(!saveDraft(clearedDraft)){
        renderDraft();
        showToast("Trip is already saved to History, but Today's draft could not be cleared.");
        return;
      }
      hideUndoPopup();
      lastEditedSnapshot = null;
      exitEdit();
      draft = clearedDraft;
      renderDraft();
      showToast("Already saved to History · Today's draft cleared");
      return;
    }

    var currentDraft = cloneDraft(draft);
    currentDraft.pendingSavedSessionId = null;
    currentDraft.location = (el.locationInput.value || "").slice(0, 100);
    var session = {
      id:uniqueSessionId(sessions),
      date:new Date().toISOString(),
      location:currentDraft.location.trim() || "Unspecified Location",
      items:cloneDraft(currentDraft).items,
      total:total(currentDraft.items)
    };
    if(!isFinite(session.total)){
      showToast("This trip total exceeds the supported numeric range");
      return;
    }

    // Persist the pending session ID with the draft before writing History.
    // This makes the two-key save recoverable without creating duplicate trips.
    currentDraft.pendingSavedSessionId = session.id;
    cancelLocationSave();
    if(!saveDraft(currentDraft)){
      draft = previousDraft;
      renderDraft();
      showToast("Trip was not saved because today's draft could not be protected");
      return;
    }
    draft = currentDraft;

    var nextSessions = cloneSessions(sessions);
    nextSessions.unshift(session);
    if(!saveSessions(nextSessions)){
      renderDraft();
      showToast("Trip was not saved. Today's list remains unchanged.");
      return;
    }
    sessions = nextSessions;
    invalidateKnownItems();

    var emptyDraft = { location:"", items:[] };
    if(!saveDraft(emptyDraft)){
      draft = currentDraft;
      renderDraft();
      showToast("Trip saved to History, but Today's draft could not be cleared. Press Save again to clear it safely.");
      return;
    }

    hideUndoPopup();
    lastEditedSnapshot = null;
    exitEdit();
    draft = emptyDraft;
    renderDraft();
    showToast("Saved · " + session.items.length + " item(s) · " + money(session.total));
  });

  // ---------- history ----------
  function renderHistory(){
    el.historyList.innerHTML = "";
    if(sessions.length === 0){
      el.historyEmpty.hidden = false;
      return;
    }
    el.historyEmpty.hidden = true;

    sessions.forEach(function(s, historyIndex){
      var wrap = document.createElement("div");
      wrap.className = "stub-wrap";

      wrap.innerHTML =
        '<div class="stub-tear"></div>' +
        '<div class="stub">' +
          '<button class="stub-top" id="history-toggle-' + historyIndex + '" type="button" aria-expanded="false" aria-controls="history-detail-' + historyIndex + '">' +
            '<span class="stub-summary-left">' +
              '<span class="stub-loc"></span>' +
              '<span class="stub-date"></span>' +
            '</span>' +
            '<span class="stub-summary-right">' +
              '<span class="stub-total"></span>' +
              '<span class="stub-count"></span>' +
            '</span>' +
          '</button>' +
          '<div class="stub-detail" id="history-detail-' + historyIndex + '" role="region" aria-labelledby="history-toggle-' + historyIndex + '" hidden>' +
            '<hr class="divider" />' +
            '<ul class="items"></ul>' +
            '<div class="stub-actions">' +
              '<button type="button" class="edit-btn">Load to Today</button>' +
              '<button type="button" class="danger del-btn">Delete</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      wrap.querySelector(".stub-loc").textContent = s.location;
      wrap.querySelector(".stub-date").textContent = formatDateTimeSafe(s.date);
      wrap.querySelector(".stub-total").textContent = money(s.total);
      wrap.querySelector(".stub-count").textContent = (Array.isArray(s.items) ? s.items.length : 0) + " item(s)";

      var itemsUl = wrap.querySelector(".items");
      if(Array.isArray(s.items)){
        s.items.forEach(function(i){
          var li = document.createElement("li");
          li.className = "item-row";
          li.innerHTML =
            '<div class="item-main">' +
              '<div class="item-name"></div>' +
              '<div class="item-meta mono"></div>' +
            '</div>' +
            '<div class="item-right"><span class="item-subtotal mono"></span></div>';
          li.querySelector(".item-name").textContent = i.name;
          li.querySelector(".item-meta").textContent = "x" + i.qty + "  ·  " + money(i.price) + "/ea";
          li.querySelector(".item-subtotal").textContent = money(subtotal(i));
          itemsUl.appendChild(li);
        });
      }

      var detail = wrap.querySelector(".stub-detail");
      var toggle = wrap.querySelector(".stub-top");
      toggle.addEventListener("click", function(){
        var willOpen = detail.hidden;
        var allDetails = document.querySelectorAll(".stub-detail");
        var allToggles = document.querySelectorAll(".stub-top");
        for(var dIdx=0; dIdx<allDetails.length; dIdx++){
          allDetails[dIdx].hidden = true;
        }
        for(var tIdx=0; tIdx<allToggles.length; tIdx++){
          allToggles[tIdx].setAttribute("aria-expanded", "false");
        }
        detail.hidden = !willOpen;
        toggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
      });

      wrap.querySelector(".edit-btn").addEventListener("click", function(){
        if(draft.items.length > 0 || draft.location){
          if(!confirm("Current items in the 'Today' tab will be replaced with this list. Continue?")) return;
        }
        var restoredItems = [];
        for(var restoredIndex=0; restoredIndex<s.items.length; restoredIndex++){
          var sourceItem = s.items[restoredIndex];
          restoredItems.push({
            id:uniqueItemId(restoredItems),
            name:sourceItem.name,
            price:sourceItem.price,
            qty:sourceItem.qty
          });
        }
        var candidate = {
          location:s.location,
          items:restoredItems
        };
        cancelLocationSave();
        if(!saveDraft(candidate)){
          showToast("The trip was not loaded because today's draft could not be saved");
          return;
        }
        hideUndoPopup();
        lastEditedSnapshot = null;
        exitEdit();
        draft = candidate;
        renderDraft();
        showTab("today");
        showToast("Loaded trip into Today tab");
      });

      wrap.querySelector(".del-btn").addEventListener("click", function(){
        if(!confirm("Delete this entire trip?")) return;
        var nextSessions = sessions.filter(function(x){ return x.id !== s.id; });
        if(!saveSessions(nextSessions)){
          showToast("Trip was not deleted because the change could not be saved");
          return;
        }
        sessions = nextSessions;
        renderHistory();
      });

      el.historyList.appendChild(wrap);
    });
  }

  // ---------- cross-tab sync ----------
  window.addEventListener("storage", function(e){
    if(e.key === SESSIONS_KEY){
      sessions = sortSessionsByDate(loadSessions());
      invalidateKnownItems();
      renderRecoveryBanner();
      if(!el.viewHistory.hidden) renderHistory();
    }
    if(e.key === DRAFT_KEY){
      draft = loadDraft();
      renderRecoveryBanner();
      if(editingId){
        var exists = false;
        for(var k=0; k<draft.items.length; k++){
          if(draft.items[k].id === editingId){ exists = true; break; }
        }
        if(!exists) exitEdit();
      }
      if(!el.viewToday.hidden) renderDraft();
    }
    if(e.key === THEME_KEY){
      var remoteTheme = "default";
      try{ remoteTheme = localStorage.getItem(THEME_KEY) || "default"; }catch(storageError){}
      applyTheme(remoteTheme, true);
    }
  });

  // ---------- version badge / manual update check ----------
  var currentVersion = "v10.1";
  var swRegistration = null;
  var hadController = Boolean(navigator.serviceWorker && navigator.serviceWorker.controller);
  var updateCheckInProgress = false;

  function renderVersionLabel(v){
    if(!v){ el.versionLabel.textContent = "…"; return; }
    currentVersion = v;
    var m = /v(\d+(?:\.\d+)?)\s*$/i.exec(v);
    el.versionLabel.textContent = m ? ("v" + m[1]) : v;
  }

  function requestVersionFromSW(){
    var worker = navigator.serviceWorker.controller || (swRegistration && swRegistration.active);
    if(worker) worker.postMessage({ type:"GET_VERSION" });
  }

  function setUpdating(isUpdating){
    el.versionBtn.disabled = isUpdating;
    if(isUpdating){
      el.versionLabel.textContent = "checking...";
    } else {
      renderVersionLabel(currentVersion);
    }
  }

  if("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("message", function(event){
      if(event.data && event.data.type === "VERSION"){
        renderVersionLabel(event.data.version);
      }
    });

    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(hadController){
        showToast("App updated in background! Ready.");
      }
      hadController = true;
      updateCheckInProgress = false;
      setUpdating(false);
      requestVersionFromSW();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        swRegistration = reg;
        requestVersionFromSW();
      }).catch(function(){
        el.versionBtn.hidden = true;
      });
    });

    el.versionBtn.addEventListener("click", function(){
      if(!swRegistration || updateCheckInProgress) return;
      updateCheckInProgress = true;
      setUpdating(true);

      var updateFound = false;
      var updateWorker = null;

      function onWorkerStateChange(){
        if(!updateWorker) return;
        var workerState = updateWorker.state;
        if(workerState === "installed" || workerState === "activating" || workerState === "activated"){
          updateCheckInProgress = false;
          setUpdating(false);
          updateWorker.removeEventListener("statechange", onWorkerStateChange);
          if(workerState === "installed"){
            if(navigator.serviceWorker.controller){
              showToast("Update installed and ready");
            } else {
              showToast("Update installed. Reload to start using it.");
            }
          }
        } else if(workerState === "redundant"){
          updateCheckInProgress = false;
          setUpdating(false);
          updateWorker.removeEventListener("statechange", onWorkerStateChange);
          showToast("Update installation did not complete");
        }
      }

      function onUpdateFound(){
        updateFound = true;
        updateWorker = swRegistration.installing;
        if(updateWorker){
          updateWorker.addEventListener("statechange", onWorkerStateChange);
        }
      }

      swRegistration.addEventListener("updatefound", onUpdateFound);
      swRegistration.update().then(function(){
        swRegistration.removeEventListener("updatefound", onUpdateFound);
        if(updateFound){
          if(updateWorker && (updateWorker.state === "installed" ||
             updateWorker.state === "activating" || updateWorker.state === "activated" ||
             updateWorker.state === "redundant")){
            onWorkerStateChange();
          } else if(!updateWorker && swRegistration.waiting){
            updateCheckInProgress = false;
            setUpdating(false);
            showToast("An app update is waiting to activate");
          } else if(updateWorker){
            el.versionBtn.disabled = true;
            el.versionLabel.textContent = "installing...";
            showToast("Update found. Installation is still in progress.");
          } else {
            updateCheckInProgress = false;
            setUpdating(false);
            showToast("Update found; waiting for the browser to finish installation.");
          }
          return;
        }
        if(swRegistration.waiting){
          updateCheckInProgress = false;
          setUpdating(false);
          showToast("An app update is waiting to activate");
          return;
        }
        if(swRegistration.installing){
          updateCheckInProgress = false;
          setUpdating(false);
          showToast("An app update is already installing");
          return;
        }
        updateCheckInProgress = false;
        setUpdating(false);
        requestVersionFromSW();
        showToast("Already on the latest version");
      }).catch(function(){
        swRegistration.removeEventListener("updatefound", onUpdateFound);
        if(updateWorker){
          updateWorker.removeEventListener("statechange", onWorkerStateChange);
        }
        updateCheckInProgress = false;
        setUpdating(false);
        showToast("Could not check for updates. Check your connection and retry.");
      });
    });
  } else {
    el.versionBtn.hidden = true;
  }

  // ---------- init ----------
  renderVersionLabel(currentVersion);
  renderDraft();
})();
</script>
</body>
</html>
