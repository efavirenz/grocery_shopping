<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grocery Receipt — Shopping List</title>
<meta name="description" content="Track grocery items and totals while shopping. View past trip history." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2F6F4E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Grocery" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --paper:#EEF0E7;
    --surface:#FFFFFF;
    --ink:#211F1B;
    --ink-soft:#726F62;
    --green:#2F6F4E;
    --green-dark:#20503A;
    --red:#B23A2E;
    --line:#CBC7BA;
    --radius:16px;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    color-scheme: light;
  }

  /* Themes */
  body.theme-ocean {
    --green: #2563EB;
    --green-dark: #1D4ED8;
    --paper: #EEF2FF;
  }
  body.theme-sakura {
    --green: #DB2777;
    --green-dark: #9D174D;
    --paper: #FDF2F8;
  }
  body.theme-sunset {
    --green: #EA580C;
    --green-dark: #C2410C;
    --paper: #FFF7ED;
  }
  body.theme-grape {
    --green: #7C3AED;
    --green-dark: #6D28D9;
    --paper: #F5F3FF;
  }
  body.theme-dark {
    --paper: #1A1A2E;
    --surface: #242438;
    --ink: #E5E5E5;
    --ink-soft: #A1A1AA;
    --green: #4ADE80;
    --green-dark: #22C55E;
    --line: #3F3F56;
    --red: #EF4444;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    min-height:100vh;
  }

  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

  :focus-visible{ outline:2.5px solid var(--green); outline-offset:2px; }

  button{ font-family:inherit; }

  .shell{
    max-width:520px;
    margin:0 auto;
    padding:18px 16px calc(96px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .header-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .menu-toggle{
    background:transparent;
    border:none;
    font-size:22px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
    padding:4px 6px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .menu-toggle:hover, .menu-toggle:focus-visible{ background:rgba(33,31,27,.08); }
  body.theme-dark .menu-toggle:hover{ background:rgba(255,255,255,.1); }

  .wordmark{
    font-family:var(--mono);
    font-weight:600;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--green-dark);
    text-transform:uppercase;
  }
  .header-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
  }
  .today-date{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
  }
  .version-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:11px;
    font-weight:600;
    padding:4px 9px;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .version-btn:active{ background:var(--paper); }
  .version-btn:disabled{ opacity:.7; cursor:default; }
  .version-btn .v-refresh{ font-size:12px; line-height:1; }

  /* ---------- Drawer Menu ---------- */
  .menu-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0;
    z-index:100;
    display:flex;
    visibility:hidden;
    opacity:0;
    transition:visibility 0.25s, opacity 0.25s;
  }
  .menu-overlay.open{
    visibility:visible;
    opacity:1;
  }
  .menu-backdrop{
    position:absolute; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.45);
  }
  .menu-drawer{
    position:relative;
    width:280px; max-width:82vw;
    height:100%;
    background:var(--surface);
    color:var(--ink);
    box-shadow:4px 0 24px rgba(0,0,0,0.2);
    padding:20px 16px;
    display:flex; flex-direction:column; gap:20px;
    transform:translateX(-100%);
    transition:transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y:auto;
  }
  .menu-overlay.open .menu-drawer{
    transform:translateX(0);
  }
  .menu-header{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:12px; border-bottom:1.5px solid var(--line);
  }
  .menu-title{ font-family:var(--mono); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.08em; }
  .menu-close{ background:transparent; border:none; font-size:24px; cursor:pointer; color:var(--ink-soft); padding:0 4px; }
  .menu-section{ display:flex; flex-direction:column; gap:10px; }
  .menu-section-title{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
  .menu-action-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:10px 12px;
    background:var(--paper); border:1.5px solid var(--line);
    border-radius:10px; font-weight:600; font-size:13.5px;
    color:var(--ink); cursor:pointer; text-align:left;
  }
  .menu-action-btn:active{ background:var(--surface); }
  .theme-swatches{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .theme-swatch{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 4px; border:1.5px solid var(--line); border-radius:10px;
    background:var(--paper); cursor:pointer; font-size:11px; font-weight:600;
    color:var(--ink); text-align:center;
  }
  .theme-swatch.active{ border-color:var(--green); box-shadow:0 0 0 2px var(--green); }
  .swatch-color{ width:22px; height:22px; border-radius:999px; border:1.5px solid rgba(0,0,0,0.15); }

  .tabs{
    display:flex;
    gap:6px;
    background:rgba(33,31,27,.06);
    padding:4px;
    border-radius:999px;
    margin-bottom:18px;
  }
  body.theme-dark .tabs{ background:rgba(255,255,255,.08); }
  .tab{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab[aria-selected="true"]{
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 1px 3px rgba(33,31,27,.14);
  }

  /* ---------- Section labels ---------- */
  .section-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 2px 8px;
  }

  /* ---------- Terminal (add-item form) ---------- */
  .terminal{
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:22px;
    box-shadow:0 1px 2px rgba(33,31,27,.06);
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:10px;
    position:relative;
    min-width:0;
  }
  .field label{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .field input{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:16px;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus{ border-color:var(--green); background:var(--surface); }
  .row-2{ display:flex; gap:10px; }
  .row-2 .field-price{ flex:2; min-width:0; }
  .row-2 .field-qty{ flex:1; min-width:0; }
  .field input.mono{ font-family:var(--mono); }

  .suggestions{
    position:absolute;
    top:100%;
    left:0; right:0;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-top:none;
    border-radius:0 0 10px 10px;
    z-index:5;
    box-shadow:0 8px 18px rgba(33,31,27,.12);
    overflow:hidden;
  }
  .suggestions button{
    display:block;
    width:100%;
    text-align:left;
    border:none;
    background:var(--surface);
    padding:10px 12px;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    border-bottom:1px solid var(--paper);
  }
  .suggestions button:last-child{ border-bottom:none; }
  .suggestions button:hover, .suggestions button:focus-visible, .suggestions button.active{ background:var(--paper); }
  body.theme-dark .suggestions button.active{ background:rgba(255,255,255,.08); }
  .suggestions button .sugg-price{ color:var(--ink-soft); font-family:var(--mono); font-size:12px; margin-left:6px; }

  .add-btn{
    width:100%;
    border:none;
    background:var(--green);
    color:#fff;
    font-weight:700;
    font-size:15px;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-btn:active{ background:var(--green-dark); }
  .add-btn:disabled{ background:#B9C4BB; cursor:not-allowed; }
  .add-btn.editing{ background:var(--ink); }
  .add-btn.editing:active{ background:#000; }

  .edit-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:rgba(47,111,78,.09);
    border-radius:99px;
    padding:8px 12px;
    margin-bottom:10px;
    font-size:12.5px;
    color:var(--green-dark);
    font-weight:600;
  }
  body.theme-dark .edit-banner{
    background:rgba(74,222,128,.15);
    color:var(--green);
  }
  .edit-banner span{ overflow-wrap:anywhere; }
  .edit-banner button{
    flex-shrink:0;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-weight:700;
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:2px 0;
  }

  /* ---------- Receipt ---------- */
  .receipt-wrap{
    filter:drop-shadow(0 14px 26px rgba(33,31,27,.15));
    margin-bottom:20px;
  }
  .tear{
    height:16px;
    background:var(--surface);
    clip-path:polygon(
      0% 70%, 8.33% 0%, 16.67% 70%, 25% 0%, 33.33% 70%, 41.67% 0%,
      50% 70%, 58.33% 0%, 66.67% 70%, 75% 0%, 83.33% 70%, 91.67% 0%,
      100% 70%, 100% 100%, 0% 100%
    );
  }
  .receipt{
    background:var(--surface);
    border-radius:0 0 4px 4px;
    padding:16px 18px 20px;
  }

  /* Running total above location */
  .running-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:2px 0 8px;
  }
  .running-total-label{
    font-family:var(--mono);
    font-weight:700;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--ink-soft);
  }
  .running-total-amount{
    font-family:var(--mono);
    font-weight:700;
    font-size:22px;
    color:var(--green);
  }

  .loc-field{
    display:flex;
    flex-direction:column;
    gap:3px;
    margin-bottom:12px;
  }
  .loc-field label{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .loc-field input{
    border:none;
    border-bottom:1.5px dashed var(--line);
    padding:4px 2px 8px;
    font-size:16px;
    font-family:var(--sans);
    font-weight:600;
    background:transparent;
    color:var(--ink);
  }
  .loc-field input:focus{ border-color:var(--green); }
  .loc-field input::placeholder{ font-weight:400; color:var(--ink-soft); }

  .divider{ border:none; border-top:1.5px dashed var(--line); margin:12px 0; }

  .items{ list-style:none; margin:0; padding:0; }
  .item-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
  }
  .item-row + .item-row{ border-top:1px dashed var(--line); }
  .item-main{ min-width:0; flex:1; }
  .item-name{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    overflow-wrap:anywhere;
  }
  .item-meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .item-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .item-subtotal{ font-size:15px; font-weight:600; }
  .item-del, .item-edit{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    padding:4px 2px;
  }
  .item-del{ font-size:18px; }
  .item-del:hover, .item-del:focus-visible{ color:var(--red); }
  .item-edit:hover, .item-edit:focus-visible{ color:var(--green); }

  .item-row.editing{
    background:rgba(47,111,78,.07);
    border-radius:8px;
    margin:0 -8px;
    padding:9px 8px;
  }
  .item-row.editing + .item-row{ border-top:none; }

  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:18px 6px;
  }

  .total-block{ margin-top:6px; }
  .total-rule{ border:none; border-top:2px solid var(--ink); margin-bottom:3px; }
  .total-rule.thin{ border-top-width:1px; margin-bottom:8px; }
  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .total-label{
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--ink-soft);
  }
  .total-amount{
    font-family:var(--mono);
    font-weight:700;
    font-size:26px;
    color:var(--ink);
  }

  /* ---------- Sticky save bar ---------- */
  .save-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 70%, transparent);
  }
  .save-bar-inner{ max-width:520px; margin:0 auto; }
  .save-btn{
    width:100%;
    border:none;
    background:var(--ink);
    color:var(--surface);
    font-weight:700;
    font-size:15px;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(33,31,27,.22);
  }
  .save-btn:disabled{ background:#B7B4A8; box-shadow:none; cursor:not-allowed; }
  .save-hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%; top:14px;
    transform:translate(-50%,-140%);
    background:var(--ink);
    color:var(--surface);
    font-size:13.5px;
    font-weight:600;
    padding:10px 16px;
    border-radius:999px;
    box-shadow:0 10px 24px rgba(33,31,27,.3);
    transition:transform .28s ease;
    z-index:150;
    pointer-events:none;
  }
  .toast.show{ transform:translate(-50%, calc(env(safe-area-inset-top))); }

  /* ---------- History ---------- */
  .stub-wrap{ margin-bottom:14px; filter:drop-shadow(0 6px 14px rgba(33,31,27,.10)); }
  .stub-tear{
    height:10px;
    background:var(--surface);
    clip-path:polygon(
      0% 60%, 12.5% 0%, 25% 60%, 37.5% 0%, 50% 60%, 62.5% 0%, 75% 60%, 87.5% 0%,
      100% 60%, 100% 100%, 0% 100%
    );
  }
  .stub{
    background:var(--surface);
    border-radius:0 0 4px 4px;
    padding:12px 14px;
  }
  .stub-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    background:transparent;
    border:none;
    width:100%;
    text-align:left;
    padding:0;
    color:inherit;
    font-family:inherit;
  }
  .stub-loc{ font-size:15px; font-weight:700; }
  .stub-date{ font-size:12px; color:var(--ink-soft); font-family:var(--mono); margin-top:2px; }
  .stub-total{ font-family:var(--mono); font-weight:700; font-size:16px; white-space:nowrap; }
  .stub-count{ font-size:11px; color:var(--ink-soft); text-align:right; margin-top:2px; }

  .stub-detail{ margin-top:10px; }
  .stub-detail[hidden]{ display:none; }
  .stub-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .stub-actions button{
    flex:1;
    border:1.5px solid var(--line);
    background:var(--surface);
    padding:8px;
    border-radius:99px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }
  .stub-actions .danger{ color:var(--red); border-color:#E7C9C4; }
  body.theme-dark .stub-actions .danger{ border-color:rgba(239,68,68,.4); }

  .history-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:40px 20px;
    line-height:1.6;
  }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggleBtn" type="button" aria-label="Open menu">&#9776;</button>
      <span class="wordmark">Grocery Receipt</span>
    </div>
    <div class="header-right">
      <button class="version-btn mono" id="versionBtn" type="button" aria-label="Check for updates">
        <span class="v-refresh" aria-hidden="true">&#8635;</span>
        <span id="versionLabel">…</span>
      </button>
      <span class="today-date mono" id="todayDate"></span>
    </div>
  </header>

  <!-- Side Drawer Menu -->
  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <div class="menu-backdrop" id="menuBackdrop"></div>
    <div class="menu-drawer" role="dialog" aria-modal="true" aria-label="Settings and Backup Menu">
      <div class="menu-header">
        <span class="menu-title">Menu</span>
        <button class="menu-close" id="menuCloseBtn" type="button" aria-label="Close menu">&times;</button>
      </div>

      <div class="menu-section">
        <span class="menu-section-title">Data Backup</span>
        <button class="menu-action-btn" id="exportBtn" type="button">
          <span>&#128229;</span> Export History (JSON)
        </button>
        <button class="menu-action-btn" id="importBtn" type="button">
          <span>&#128228;</span> Import History (JSON)
        </button>
        <input type="file" id="importFileInput" accept=".json" hidden />
      </div>

      <div class="menu-section">
        <span class="menu-section-title">Color Theme</span>
        <div class="theme-swatches" id="themeSwatches"></div>
      </div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabToday" role="tab" aria-selected="true">Today</button>
    <button class="tab" id="tabHistory" role="tab" aria-selected="false">History</button>
  </div>

  <!-- ============ TODAY VIEW ============ -->
  <section id="viewToday">
    <p class="section-label">Add Item</p>
    <div class="terminal">
      <div class="field" id="nameFieldWrap">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" placeholder="e.g. Eggs, Milk" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" aria-controls="suggestions" />
        <div class="suggestions" id="suggestions" role="listbox" hidden></div>
      </div>
      <div class="row-2">
        <div class="field field-price">
          <label for="itemPrice">Price (฿)</label>
          <input type="number" id="itemPrice" class="mono" placeholder="0.00" inputmode="decimal" min="0" step="0.01" />
        </div>
        <div class="field field-qty">
          <label for="itemQty">Qty</label>
          <input type="number" id="itemQty" class="mono" value="1" inputmode="numeric" min="1" step="1" />
        </div>
      </div>
      <div class="edit-banner" id="editBanner" hidden>
        <span id="editBannerText"></span>
        <button type="button" id="cancelEditBtn">Cancel</button>
      </div>
      <button class="add-btn" id="addBtn">+ Add Item</button>
    </div>

    <p class="section-label">Today's Receipt</p>
    <div class="receipt-wrap">
      <div class="tear"></div>
      <div class="receipt">
        <div class="running-total">
          <span class="running-total-label">RUNNING TOTAL</span>
          <span class="running-total-amount mono" id="runningTotalAmount">฿0.00</span>
        </div>
        <hr class="divider" />
        <div class="loc-field">
          <label for="locationInput">Location</label>
          <input type="text" id="locationInput" placeholder="Store or supermarket name" />
        </div>
        <hr class="divider" />
        <ul class="items" id="itemsList"></ul>
        <div id="emptyNote" class="empty-note">No items yet. Add your first item above.</div>
        <div class="total-block">
          <hr class="total-rule" />
          <hr class="total-rule thin" />
          <div class="total-row">
            <span class="total-label">TOTAL</span>
            <span class="total-amount mono" id="totalAmount">฿0.00</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ HISTORY VIEW ============ -->
  <section id="viewHistory" hidden>
    <p class="section-label">Shopping History</p>
    <div id="historyList"></div>
    <div id="historyEmpty" class="history-empty" hidden>
      No shopping history yet.<br />Save your first trip from the "Today" tab.
    </div>
  </section>
</div>

<div class="save-bar" id="saveBarToday">
  <div class="save-bar-inner">
    <button class="save-btn" id="saveBtn" disabled>Save Today's List</button>
    <div class="save-hint" id="saveHint">Add at least 1 item before saving</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var SESSIONS_KEY = "grocery_sessions_v1";
  var DRAFT_KEY = "grocery_draft_v1";
  var THEME_KEY = "grocery_theme_v1";

  // ---------- storage helpers & validation ----------
  var cachedKnownItems = null;
  function invalidateKnownItems(){ cachedKnownItems = null; }

  function validateItem(i){
    if(!i || typeof i !== "object") return null;
    var name = typeof i.name === "string" ? i.name.trim() : "";
    var rawPrice = typeof i.price === "number" ? i.price : parseFloat(i.price);
    var price = isFinite(rawPrice) && rawPrice >= 0 ? roundMoney(rawPrice) : 0;
    var rawQty = typeof i.qty === "number" ? i.qty : parseInt(i.qty, 10);
    var qty = isFinite(rawQty) && rawQty >= 1 ? Math.floor(rawQty) : 1;
    if(!name) return null;
    return {
      id: (typeof i.id === "string" && i.id) ? i.id : uid(),
      name: name,
      price: price,
      qty: qty
    };
  }

  function validateSession(s){
    if(!s || typeof s !== "object") return null;
    if(!Array.isArray(s.items) || s.items.length === 0) return null;
    var validItems = [];
    for(var j=0; j<s.items.length; j++){
      var item = validateItem(s.items[j]);
      if(item) validItems.push(item);
    }
    if(validItems.length === 0) return null;

    var d = s.date && !isNaN(new Date(s.date).getTime()) ? new Date(s.date).toISOString() : new Date().toISOString();
    var loc = typeof s.location === "string" && s.location.trim() ? s.location.trim() : "Unspecified Location";
    return {
      id: (typeof s.id === "string" && s.id) ? s.id : uid(),
      date: d,
      location: loc,
      items: validItems,
      total: total(validItems)
    };
  }

  function loadSessions(){
    try{
      var raw = localStorage.getItem(SESSIONS_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(parsed)) return [];
      var sanitized = [];
      for(var i=0; i<parsed.length; i++){
        var s = validateSession(parsed[i]);
        if(s) sanitized.push(s);
      }
      return sanitized;
    }catch(e){ return []; }
  }
  function saveSessions(list){
    try{
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
      invalidateKnownItems();
      return true;
    }catch(e){
      if(e && (e.name === "QuotaExceededError" || e.code === 22)){
        showToast("⚠️ Storage full: export & delete old trips");
      }
      return false;
    }
  }
  function loadDraft(){
    try{
      var raw = localStorage.getItem(DRAFT_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      if(!parsed || typeof parsed !== "object") return { location:"", items:[] };
      var validItems = [];
      if(Array.isArray(parsed.items)){
        for(var i=0; i<parsed.items.length; i++){
          var it = validateItem(parsed.items[i]);
          if(it) validItems.push(it);
        }
      }
      return {
        location: typeof parsed.location === "string" ? parsed.location : "",
        items: validItems
      };
    }catch(e){ return { location:"", items:[] }; }
  }
  function saveDraft(d){
    try{
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
      return true;
    }catch(e){
      if(e && (e.name === "QuotaExceededError" || e.code === 22)){
        showToast("⚠️ Storage full: draft cannot be saved");
      }
      return false;
    }
  }

  function uid(){
    if(typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"){
      return crypto.randomUUID().slice(0,8);
    }
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function roundMoney(n){
    return Math.round((Number(n) || 0) * 100) / 100;
  }
  function money(n){
    var num = roundMoney(n);
    var sign = num < 0 ? "-" : "";
    return sign + "฿" + Math.abs(num).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  function subtotal(item){ return roundMoney(item.price * item.qty); }
  function total(items){ return roundMoney(items.reduce(function(s,i){ return s + subtotal(i); }, 0)); }

  var dateFmt = new Intl.DateTimeFormat("en-US", { day:"numeric", month:"short", year:"numeric" });
  var dateTimeFmt = new Intl.DateTimeFormat("en-US", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });

  function formatDateTimeSafe(dateStr){
    if(!dateStr) return "Unknown date";
    try{
      var d = new Date(dateStr);
      if(isNaN(d.getTime())) return "Unknown date";
      return dateTimeFmt.format(d);
    }catch(e){
      return "Unknown date";
    }
  }

  // ---------- state ----------
  var sessions = loadSessions();
  var draft = loadDraft();
  var expandedStub = null;
  var editingId = null;

  // ---------- DOM refs ----------
  var el = {
    todayDate: document.getElementById("todayDate"),
    versionBtn: document.getElementById("versionBtn"),
    versionLabel: document.getElementById("versionLabel"),
    tabToday: document.getElementById("tabToday"),
    tabHistory: document.getElementById("tabHistory"),
    viewToday: document.getElementById("viewToday"),
    viewHistory: document.getElementById("viewHistory"),
    saveBarToday: document.getElementById("saveBarToday"),

    itemName: document.getElementById("itemName"),
    itemPrice: document.getElementById("itemPrice"),
    itemQty: document.getElementById("itemQty"),
    addBtn: document.getElementById("addBtn"),
    suggestions: document.getElementById("suggestions"),
    editBanner: document.getElementById("editBanner"),
    editBannerText: document.getElementById("editBannerText"),
    cancelEditBtn: document.getElementById("cancelEditBtn"),

    runningTotalAmount: document.getElementById("runningTotalAmount"),
    locationInput: document.getElementById("locationInput"),
    itemsList: document.getElementById("itemsList"),
    emptyNote: document.getElementById("emptyNote"),
    totalAmount: document.getElementById("totalAmount"),

    saveBtn: document.getElementById("saveBtn"),
    saveHint: document.getElementById("saveHint"),

    historyList: document.getElementById("historyList"),
    historyEmpty: document.getElementById("historyEmpty"),

    toast: document.getElementById("toast"),

    menuToggleBtn: document.getElementById("menuToggleBtn"),
    menuCloseBtn: document.getElementById("menuCloseBtn"),
    menuBackdrop: document.getElementById("menuBackdrop"),
    menuOverlay: document.getElementById("menuOverlay"),
    exportBtn: document.getElementById("exportBtn"),
    importBtn: document.getElementById("importBtn"),
    importFileInput: document.getElementById("importFileInput"),
    themeSwatches: document.getElementById("themeSwatches")
  };

  el.todayDate.textContent = dateFmt.format(new Date());

  // ---------- Theme Switcher ----------
  var themes = [
    { id:"default", label:"Forest", color:"#2F6F4E" },
    { id:"ocean", label:"Ocean", color:"#2563EB" },
    { id:"sakura", label:"Sakura", color:"#DB2777" },
    { id:"sunset", label:"Sunset", color:"#EA580C" },
    { id:"grape", label:"Grape", color:"#7C3AED" },
    { id:"dark", label:"Dark", color:"#4ADE80" }
  ];

  var themeMetaColors = {
    "default": "#2F6F4E",
    "ocean": "#2563EB",
    "sakura": "#DB2777",
    "sunset": "#EA580C",
    "grape": "#7C3AED",
    "dark": "#1A1A2E"
  };

  function applyTheme(themeId){
    themes.forEach(function(t){
      if(t.id !== "default") document.body.classList.remove("theme-" + t.id);
    });
    if(themeId !== "default"){
      document.body.classList.add("theme-" + themeId);
    }
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    if(metaTheme){
      metaTheme.setAttribute("content", themeMetaColors[themeId] || themeMetaColors["default"]);
    }
    try{ localStorage.setItem(THEME_KEY, themeId); }catch(e){}
    renderThemeSwatches(themeId);
  }

  function renderThemeSwatches(activeId){
    el.themeSwatches.innerHTML = "";
    themes.forEach(function(t){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "theme-swatch" + (t.id === activeId ? " active" : "");
      
      var swatch = document.createElement("span");
      swatch.className = "swatch-color";
      swatch.style.backgroundColor = t.color;
      
      var label = document.createElement("span");
      label.textContent = t.label;
      
      btn.appendChild(swatch);
      btn.appendChild(label);
      btn.addEventListener("click", function(){ applyTheme(t.id); });
      el.themeSwatches.appendChild(btn);
    });
  }

  var savedTheme = localStorage.getItem(THEME_KEY) || "default";
  applyTheme(savedTheme);

  // ---------- Drawer Menu ----------
  function openMenu(){
    el.menuOverlay.classList.add("open");
    el.menuOverlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    el.menuCloseBtn.focus();
  }
  function closeMenu(){
    el.menuOverlay.classList.remove("open");
    el.menuOverlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    el.menuToggleBtn.focus();
  }

  el.menuToggleBtn.addEventListener("click", openMenu);
  el.menuCloseBtn.addEventListener("click", closeMenu);
  el.menuBackdrop.addEventListener("click", closeMenu);

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(el.menuOverlay.classList.contains("open")) closeMenu();
      if(!el.suggestions.hidden) closeSuggestions();
    }
  });

  // ---------- Export / Import ----------
  function downloadFileFallback(blob, fileName){
    var url = URL.createObjectURL(blob);
    try{
      var a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast("History exported successfully");
      closeMenu();
    }finally{
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }
  }

  el.exportBtn.addEventListener("click", function(){
    if(sessions.length === 0){
      showToast("No history data to export");
      return;
    }
    var exportData = {
      version: 1,
      exportedAt: new Date().toISOString(),
      sessions: sessions
    };
    var jsonStr = JSON.stringify(exportData, null, 2);
    var dateStr = new Date().toISOString().slice(0,10);
    var fileName = "grocery_history_" + dateStr + ".json";
    var blob = new Blob([jsonStr], { type: "application/json" });

    if(navigator.canShare && typeof File !== "undefined"){
      try{
        var file = new File([blob], fileName, { type: "application/json" });
        if(navigator.canShare({ files: [file] })){
          navigator.share({
            files: [file],
            title: "Grocery Shopping History",
            text: "Grocery shopping trip history backup"
          }).then(function(){
            showToast("History shared successfully");
            closeMenu();
          }).catch(function(err){
            if(err && err.name !== "AbortError"){
              downloadFileFallback(blob, fileName);
            }
          });
          return;
        }
      }catch(e){}
    }
    downloadFileFallback(blob, fileName);
  });

  el.importBtn.addEventListener("click", function(){
    el.importFileInput.click();
  });

  el.importFileInput.addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        var importedSessions = Array.isArray(data) ? data : (data.sessions || []);
        if(!Array.isArray(importedSessions)){
          showToast("Invalid JSON file format");
          return;
        }
        var existingMap = {};
        sessions.forEach(function(s){ existingMap[s.id] = true; });
        var addedCount = 0;
        importedSessions.forEach(function(raw){
          var valid = validateSession(raw);
          if(valid && !existingMap[valid.id]){
            sessions.push(valid);
            existingMap[valid.id] = true;
            addedCount++;
          }
        });
        sessions.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
        saveSessions(sessions);
        showToast("Imported " + addedCount + " valid trip(s)");
        if(!el.viewHistory.hidden) renderHistory();
        closeMenu();
      }catch(err){
        showToast("Error parsing JSON file");
      }
      el.importFileInput.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- tabs ----------
  function showTab(name){
    var isToday = name === "today";
    el.viewToday.hidden = !isToday;
    el.viewHistory.hidden = isToday;
    el.saveBarToday.hidden = !isToday;
    el.tabToday.setAttribute("aria-selected", isToday ? "true" : "false");
    el.tabHistory.setAttribute("aria-selected", isToday ? "false" : "true");
    if(!isToday) renderHistory();
  }
  el.tabToday.addEventListener("click", function(){ showTab("today"); });
  el.tabHistory.addEventListener("click", function(){ showTab("history"); });

  // ---------- toast ----------
  var toastTimer = null;
  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.classList.remove("show"); }, 2400);
  }

  // ---------- render: today / draft ----------
  function renderDraft(){
    el.locationInput.value = draft.location || "";

    el.itemsList.innerHTML = "";
    if(draft.items.length === 0){
      el.emptyNote.style.display = "block";
    } else {
      el.emptyNote.style.display = "none";
      draft.items.forEach(function(item){
        var li = document.createElement("li");
        li.className = "item-row" + (item.id === editingId ? " editing" : "");
        li.innerHTML =
          '<div class="item-main">' +
            '<div class="item-name"></div>' +
            '<div class="item-meta mono"></div>' +
          '</div>' +
          '<div class="item-right">' +
            '<span class="item-subtotal mono"></span>' +
            '<button class="item-edit" aria-label="Edit item" type="button">&#9998;</button>' +
            '<button class="item-del" aria-label="Delete item" type="button">&times;</button>' +
          '</div>';
        li.querySelector(".item-name").textContent = item.name;
        li.querySelector(".item-meta").textContent = "x" + item.qty + "  ·  " + money(item.price) + "/ea";
        li.querySelector(".item-subtotal").textContent = money(subtotal(item));
        li.querySelector(".item-edit").addEventListener("click", function(){ enterEdit(item); });
        li.querySelector(".item-del").addEventListener("click", function(){ removeItem(item.id); });
        el.itemsList.appendChild(li);
      });
    }

    var t = total(draft.items);
    el.runningTotalAmount.textContent = money(t);
    el.totalAmount.textContent = money(t);

    var hasItems = draft.items.length > 0;
    el.saveBtn.disabled = !hasItems;
    el.saveHint.textContent = hasItems
      ? draft.items.length + " item(s) · Ready to save"
      : "Add at least 1 item before saving";
  }

  function persistDraft(){ saveDraft(draft); }

  el.locationInput.addEventListener("input", function(){
    draft.location = el.locationInput.value;
    persistDraft();
  });

  // ---------- add / edit / remove items ----------
  function clearForm(){
    el.itemName.value = "";
    el.itemPrice.value = "";
    el.itemQty.value = "1";
    closeSuggestions();
  }

  function enterEdit(item){
    editingId = item.id;
    el.itemName.value = item.name;
    el.itemPrice.value = item.price;
    el.itemQty.value = item.qty;
    el.editBannerText.textContent = "Editing: " + item.name;
    el.editBanner.hidden = false;
    el.addBtn.textContent = "Save Changes";
    el.addBtn.classList.add("editing");
    renderDraft();
    el.itemName.focus();
  }

  function exitEdit(){
    editingId = null;
    el.editBanner.hidden = true;
    el.addBtn.textContent = "+ Add Item";
    el.addBtn.classList.remove("editing");
    clearForm();
  }

  el.cancelEditBtn.addEventListener("click", function(){
    exitEdit();
    renderDraft();
  });

  function addItem(){
    var name = el.itemName.value.trim();
    var price = parseFloat(el.itemPrice.value);
    var qty = parseInt(el.itemQty.value, 10);

    if(!name){ el.itemName.focus(); return; }
    if(isNaN(price) || price < 0){
      showToast("Please enter a valid price (≥ 0)");
      el.itemPrice.focus();
      return;
    }
    if(isNaN(qty) || qty < 1){
      qty = 1;
    }

    price = roundMoney(price);

    if(editingId){
      var idx = -1;
      for(var i=0;i<draft.items.length;i++){
        if(draft.items[i].id === editingId){ idx = i; break; }
      }
      if(idx !== -1){
        draft.items[idx].name = name;
        draft.items[idx].price = price;
        draft.items[idx].qty = qty;
      } else {
        draft.items.push({ id:uid(), name:name, price:price, qty:qty });
      }
      exitEdit();
    } else {
      draft.items.push({ id:uid(), name:name, price:price, qty:qty });
      clearForm();
      el.itemName.focus();
    }

    persistDraft();
    renderDraft();
  }
  el.addBtn.addEventListener("click", addItem);

  function removeItem(id){
    if(id === editingId){ exitEdit(); }
    draft.items = draft.items.filter(function(i){ return i.id !== id; });
    persistDraft();
    renderDraft();
  }

  // ---------- autocomplete (memoized & keyboard accessible) ----------
  var activeSuggIndex = -1;
  var currentSuggestions = [];

  function knownItems(){
    if(cachedKnownItems) return cachedKnownItems;
    var map = {};
    var all = [];
    sessions.forEach(function(s){
      if(Array.isArray(s.items)){
        s.items.forEach(function(i){ all.push({ item:i, when:s.date }); });
      }
    });
    all.sort(function(a,b){
      var timeA = new Date(a.when).getTime() || 0;
      var timeB = new Date(b.when).getTime() || 0;
      return timeB - timeA;
    });
    all.forEach(function(rec){
      var key = rec.item.name.trim().toLowerCase();
      if(!map[key]) map[key] = rec.item;
    });
    cachedKnownItems = Object.keys(map).map(function(k){ return map[k]; });
    return cachedKnownItems;
  }

  function closeSuggestions(){
    el.suggestions.hidden = true;
    el.suggestions.innerHTML = "";
    el.itemName.setAttribute("aria-expanded", "false");
    activeSuggIndex = -1;
    currentSuggestions = [];
  }

  function updateSuggestionSelection(){
    var buttons = el.suggestions.querySelectorAll("button");
    for(var i=0; i<buttons.length; i++){
      if(i === activeSuggIndex){
        buttons[i].classList.add("active");
        buttons[i].setAttribute("aria-selected", "true");
        if(typeof buttons[i].scrollIntoView === "function"){
          buttons[i].scrollIntoView({ block:"nearest" });
        }
      } else {
        buttons[i].classList.remove("active");
        buttons[i].setAttribute("aria-selected", "false");
      }
    }
  }

  function selectSuggestion(item){
    el.itemName.value = item.name;
    el.itemPrice.value = item.price;
    closeSuggestions();
    el.itemPrice.focus();
    el.itemPrice.select();
  }

  el.itemName.addEventListener("input", function(){
    var q = el.itemName.value.trim().toLowerCase();
    if(!q){ closeSuggestions(); return; }
    var matches = knownItems().filter(function(i){
      return i.name.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 5);

    if(matches.length === 0){ closeSuggestions(); return; }

    currentSuggestions = matches;
    activeSuggIndex = -1;
    el.suggestions.innerHTML = "";
    matches.forEach(function(m, idx){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("role", "option");
      btn.setAttribute("aria-selected", "false");
      btn.id = "sugg-option-" + idx;
      btn.innerHTML = '<span></span><span class="sugg-price mono"></span>';
      btn.querySelector("span").textContent = m.name;
      btn.querySelector(".sugg-price").textContent = money(m.price);
      btn.addEventListener("click", function(){ selectSuggestion(m); });
      el.suggestions.appendChild(btn);
    });
    el.suggestions.hidden = false;
    el.itemName.setAttribute("aria-expanded", "true");
  });

  el.itemName.addEventListener("keydown", function(e){
    if(!el.suggestions.hidden && currentSuggestions.length > 0){
      if(e.key === "ArrowDown"){
        e.preventDefault();
        activeSuggIndex = (activeSuggIndex + 1) % currentSuggestions.length;
        updateSuggestionSelection();
        return;
      }
      if(e.key === "ArrowUp"){
        e.preventDefault();
        activeSuggIndex = (activeSuggIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
        updateSuggestionSelection();
        return;
      }
      if(e.key === "Enter" && activeSuggIndex >= 0 && activeSuggIndex < currentSuggestions.length){
        e.preventDefault();
        selectSuggestion(currentSuggestions[activeSuggIndex]);
        return;
      }
      if(e.key === "Escape"){
        e.preventDefault();
        closeSuggestions();
        return;
      }
    }
    if(e.key === "Enter"){
      e.preventDefault();
      addItem();
    }
  });

  [el.itemPrice, el.itemQty].forEach(function(input){
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); addItem(); }
    });
  });

  document.getElementById("nameFieldWrap").addEventListener("focusout", function(e){
    if(!document.getElementById("nameFieldWrap").contains(e.relatedTarget)){
      closeSuggestions();
    }
  });

  document.addEventListener("click", function(e){
    if(!document.getElementById("nameFieldWrap").contains(e.target)) closeSuggestions();
  });

  // ---------- save trip ----------
  el.saveBtn.addEventListener("click", function(){
    if(draft.items.length === 0) return;
    var session = {
      id: uid(),
      date: new Date().toISOString(),
      location: draft.location.trim() || "Unspecified Location",
      items: draft.items,
      total: total(draft.items)
    };
    sessions.unshift(session);
    var saved = saveSessions(sessions);
    if(!saved){
      sessions.shift();
      return;
    }

    showToast("Saved · " + session.items.length + " item(s) · " + money(session.total));

    exitEdit();
    draft = { location:"", items:[] };
    persistDraft();
    renderDraft();
  });

  // ---------- history ----------
  function renderHistory(){
    el.historyList.innerHTML = "";
    if(sessions.length === 0){
      el.historyEmpty.hidden = false;
      return;
    }
    el.historyEmpty.hidden = true;

    sessions.forEach(function(s){
      var wrap = document.createElement("div");
      wrap.className = "stub-wrap";

      wrap.innerHTML =
        '<div class="stub-tear"></div>' +
        '<div class="stub">' +
          '<button class="stub-top" type="button">' +
            '<span>' +
              '<div class="stub-loc"></div>' +
              '<div class="stub-date"></div>' +
            '</span>' +
            '<span>' +
              '<div class="stub-total"></div>' +
              '<div class="stub-count"></div>' +
            '</span>' +
          '</button>' +
          '<div class="stub-detail" hidden>' +
            '<hr class="divider" />' +
            '<ul class="items"></ul>' +
            '<div class="stub-actions">' +
              '<button type="button" class="edit-btn">Load to Today</button>' +
              '<button type="button" class="danger del-btn">Delete</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      wrap.querySelector(".stub-loc").textContent = s.location;
      wrap.querySelector(".stub-date").textContent = formatDateTimeSafe(s.date);
      wrap.querySelector(".stub-total").textContent = money(s.total);
      wrap.querySelector(".stub-count").textContent = (Array.isArray(s.items) ? s.items.length : 0) + " item(s)";

      var itemsUl = wrap.querySelector(".items");
      if(Array.isArray(s.items)){
        s.items.forEach(function(i){
          var li = document.createElement("li");
          li.className = "item-row";
          li.innerHTML =
            '<div class="item-main">' +
              '<div class="item-name"></div>' +
              '<div class="item-meta mono"></div>' +
            '</div>' +
            '<div class="item-right"><span class="item-subtotal mono"></span></div>';
          li.querySelector(".item-name").textContent = i.name;
          li.querySelector(".item-meta").textContent = "x" + i.qty + "  ·  " + money(i.price) + "/ea";
          li.querySelector(".item-subtotal").textContent = money(subtotal(i));
          itemsUl.appendChild(li);
        });
      }

      var detail = wrap.querySelector(".stub-detail");
      wrap.querySelector(".stub-top").addEventListener("click", function(){
        var willOpen = detail.hidden;
        document.querySelectorAll(".stub-detail").forEach(function(d){ d.hidden = true; });
        detail.hidden = !willOpen;
      });

      wrap.querySelector(".edit-btn").addEventListener("click", function(){
        if(draft.items.length > 0 || draft.location){
          if(!confirm("Current items in the 'Today' tab will be replaced with this list. Continue?")) return;
        }
        exitEdit();
        draft = {
          location: s.location,
          items: s.items.map(function(i){
            return { id: uid(), name: i.name, price: i.price, qty: i.qty };
          })
        };
        persistDraft();
        renderDraft();
        showTab("today");
        showToast("Loaded trip into Today tab");
      });

      wrap.querySelector(".del-btn").addEventListener("click", function(){
        if(!confirm("Delete this entire trip?")) return;
        sessions = sessions.filter(function(x){ return x.id !== s.id; });
        saveSessions(sessions);
        renderHistory();
      });

      el.historyList.appendChild(wrap);
    });
  }

  // ---------- cross-tab sync ----------
  window.addEventListener("storage", function(e){
    if(e.key === SESSIONS_KEY){
      sessions = loadSessions();
      invalidateKnownItems();
      if(!el.viewHistory.hidden) renderHistory();
    }
    if(e.key === DRAFT_KEY){
      draft = loadDraft();
      if(editingId){
        var exists = false;
        for(var k=0; k<draft.items.length; k++){
          if(draft.items[k].id === editingId){ exists = true; break; }
        }
        if(!exists) exitEdit();
      }
      if(!el.viewToday.hidden) renderDraft();
    }
    if(e.key === THEME_KEY){
      var remoteTheme = localStorage.getItem(THEME_KEY) || "default";
      applyTheme(remoteTheme);
    }
  });

  // ---------- version badge / manual update check ----------
  var currentVersion = "v6";
  var swRegistration = null;

  function renderVersionLabel(v){
    if(!v){ el.versionLabel.textContent = "…"; return; }
    currentVersion = v;
    var m = /v(\d+)\s*$/i.exec(v);
    el.versionLabel.textContent = m ? ("v" + m[1]) : v;
  }

  function requestVersionFromSW(){
    var worker = navigator.serviceWorker.controller || (swRegistration && swRegistration.active);
    if(worker) worker.postMessage({ type:"GET_VERSION" });
  }

  function setUpdating(isUpdating){
    el.versionBtn.disabled = isUpdating;
    if(isUpdating){
      el.versionLabel.textContent = "updating...";
    } else {
      renderVersionLabel(currentVersion);
    }
  }

  if("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("message", function(event){
      if(event.data && event.data.type === "VERSION"){ renderVersionLabel(event.data.version); }
    });

    navigator.serviceWorker.addEventListener("controllerchange", function(){
      showToast("App updated in background! Ready.");
      requestVersionFromSW();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        swRegistration = reg;
        requestVersionFromSW();
      }).catch(function(){ el.versionBtn.hidden = true; });
    });

    el.versionBtn.addEventListener("click", function(){
      if(!swRegistration){ return; }
      setUpdating(true);
      var updateFound = false;
      function onUpdateFound(){ updateFound = true; }
      swRegistration.addEventListener("updatefound", onUpdateFound);
      swRegistration.update().catch(function(){});

      setTimeout(function(){
        swRegistration.removeEventListener("updatefound", onUpdateFound);
        if(!updateFound){
          setUpdating(false);
          requestVersionFromSW();
          showToast("Already on the latest version");
        }
      }, 2500);
    });
  } else {
    el.versionBtn.hidden = true;
  }

  // ---------- init ----------
  renderVersionLabel(currentVersion);
  renderDraft();
})();
</script>
</body>
</html>
